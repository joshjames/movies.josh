<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joshflix Player</title>
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #020617; /* Deep cinema black-blue */
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
        }

        /* Seamless Edge-to-Edge Player */
        .player-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Preserves original movie aspect ratios perfectly */
            outline: none;
        }

        /* Premium Floating Overlay Back Button */
        .back-overlay-btn {
            position: absolute;
            top: 24px;
            left: 24px;
            z-index: 10;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #f1f5f9;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            opacity: 0.3; /* Subtle presence until hovered */
        }

        .back-overlay-btn:hover {
            opacity: 1;
            background: rgba(15, 23, 42, 0.9);
            transform: translateX(-2px);
        }

        /* Quality Indicator Tag */
        .quality-badge {
            position: absolute;
            bottom: 24px;
            right: 24px;
            z-index: 10;
            background: rgba(229, 9, 20, 0.8); /* Joshflix Red */
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            letter-spacing: 0.5px;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        /* Fade utilities for overlay elements when mouse is still */
        .hide-controls {
            opacity: 0 !important;
            cursor: none;
        }
        /* Premium Floating Overlay Next Button */
        .next-overlay-btn {
            position: absolute;
            top: 24px;
            right: 24px;
            z-index: 10;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #f1f5f9;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            opacity: 0.3;
        }

        .next-overlay-btn:hover {
            opacity: 1;
            background: rgba(15, 23, 42, 0.9);
            transform: translateX(2px);
        }

        .subtitle-track-select {
            position: absolute;
            bottom: 24px;
            left: 24px;
            z-index: 10;
            background: rgba(15, 23, 42, 0.75);
            color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 0.8rem;
            max-width: 44vw;
        }

        .audio-track-select {
            position: absolute;
            bottom: 72px;
            left: 24px;
            z-index: 10;
            background: rgba(15, 23, 42, 0.75);
            color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 0.8rem;
            max-width: 44vw;
        }

        .ios-seek-overlay {
            position: absolute;
            left: 16px;
            right: 16px;
            bottom: 12px;
            z-index: 14;
            display: none;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border-radius: 10px;
            background: rgba(2, 6, 23, 0.78);
            border: 1px solid rgba(148, 163, 184, 0.35);
            backdrop-filter: blur(6px);
        }

        .ios-seek-overlay.show {
            display: flex;
        }

        .ios-seek-time {
            min-width: 44px;
            font-size: 0.74rem;
            color: #e2e8f0;
            font-variant-numeric: tabular-nums;
            text-align: center;
            user-select: none;
        }

        .ios-seek-range {
            flex: 1;
            accent-color: #ef4444;
            min-height: 26px;
        }

        @supports (padding: env(safe-area-inset-bottom)) {
            .back-overlay-btn,
            .next-overlay-btn,
            .subtitle-track-select,
            .audio-track-select,
            .quality-badge {
                margin-bottom: env(safe-area-inset-bottom);
            }
        }

        @media (hover: none) and (pointer: coarse) {
            .back-overlay-btn,
            .next-overlay-btn {
                top: 16px;
                opacity: 0.82;
            }

            .subtitle-track-select {
                top: 68px;
                bottom: auto;
                left: 16px;
                max-width: calc(100vw - 32px);
                font-size: 0.76rem;
            }

            .audio-track-select {
                top: 112px;
                bottom: auto;
                left: 16px;
                max-width: calc(100vw - 32px);
                font-size: 0.76rem;
            }

            .quality-badge {
                top: 16px;
                bottom: auto;
                right: 16px;
            }

            .ios-seek-overlay {
                left: 12px;
                right: 12px;
                bottom: 10px;
            }
        }
    </style>
</head>
<body>

    <div class="player-container" id="stage">
        <a href="/" class="back-overlay-btn" id="backBtn">⏮ Back to Show</a>
        <button class="next-overlay-btn hide-controls" id="nextBtn">Next Episode ⏭</button>
        <select class="audio-track-select" id="audioTrackSelect" title="Audio track selector">
            <option value="auto">Audio: Auto</option>
        </select>
        <select class="subtitle-track-select" id="subtitleTrackSelect" title="Subtitle track selector">
            <option value="auto">Subtitles: Auto</option>
            <option value="off">Subtitles: Off</option>
        </select>

        <div class="ios-seek-overlay" id="iosSeekOverlay" aria-hidden="true">
            <span class="ios-seek-time" id="iosSeekCurrent">0:00</span>
            <input class="ios-seek-range" id="iosSeekRange" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek position">
            <span class="ios-seek-time" id="iosSeekDuration">0:00</span>
        </div>
        
        <div class="quality-badge" id="qualityTag">DETECTING...</div>
        <video id="cinemaVideo" controls autoplay playsinline webkit-playsinline preload="metadata" crossorigin="anonymous"></video>
    </div>

    <script>
        // 1. Declare URL Params FIRST so they are available to everything below
        const params = new URLSearchParams(window.location.search);
        const movieId = params.get('id');
        let seasonParam = params.get('season');
        let episodeParam = params.get('episode');

        // 2. Initialize UI Element References and State Trackers
        let currentTvPlaylist = [];
        let currentTrackIndex = -1;
        const videoEl = document.getElementById('cinemaVideo');
        const qualityTag = document.getElementById('qualityTag');
        const backBtn = document.getElementById('backBtn');
        const nextBtn = document.getElementById('nextBtn');
        const audioTrackSelect = document.getElementById('audioTrackSelect');
        const subtitleTrackSelect = document.getElementById('subtitleTrackSelect');
        const iosSeekOverlay = document.getElementById('iosSeekOverlay');
        const iosSeekRange = document.getElementById('iosSeekRange');
        const iosSeekCurrent = document.getElementById('iosSeekCurrent');
        const iosSeekDuration = document.getElementById('iosSeekDuration');
        const stage = document.getElementById('stage');
        const isTouchDevice = window.matchMedia('(hover: none) and (pointer: coarse)').matches;
        const isIOSDevice = /iPad|iPhone|iPod/.test(navigator.userAgent)
            || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        const useCustomInlineSeek = isIOSDevice && isTouchDevice;
        let audioTracks = [];
        let subtitleTracks = [];
        let currentPlaybackFile = '';
        let currentRemoteStreamUrl = '';
        let isSeekingWithOverlay = false;

        videoEl.controls = true;
        videoEl.playsInline = true;
        videoEl.preload = 'metadata';
        videoEl.setAttribute('playsinline', '');
        videoEl.setAttribute('webkit-playsinline', '');
        videoEl.setAttribute('x-webkit-airplay', 'allow');

        function formatPlaybackClock(totalSeconds = 0) {
            const secs = Math.max(0, Math.floor(Number(totalSeconds) || 0));
            const hours = Math.floor(secs / 3600);
            const mins = Math.floor((secs % 3600) / 60);
            const rem = secs % 60;
            if (hours > 0) {
                return `${hours}:${String(mins).padStart(2, '0')}:${String(rem).padStart(2, '0')}`;
            }
            return `${mins}:${String(rem).padStart(2, '0')}`;
        }

        function isVideoInFullscreen() {
            return Boolean(document.fullscreenElement)
                || Boolean(document.webkitFullscreenElement)
                || Boolean(videoEl.webkitDisplayingFullscreen);
        }

        function syncCustomSeekUi() {
            if (!useCustomInlineSeek) return;

            const duration = Number(videoEl.duration) || 0;
            const current = Number(videoEl.currentTime) || 0;

            iosSeekDuration.textContent = formatPlaybackClock(duration);

            if (!isSeekingWithOverlay) {
                iosSeekCurrent.textContent = formatPlaybackClock(current);
                if (duration > 0) {
                    iosSeekRange.value = String(Math.round((current / duration) * 1000));
                } else {
                    iosSeekRange.value = '0';
                }
            }
        }

        function updateCustomSeekVisibility() {
            if (!useCustomInlineSeek) {
                iosSeekOverlay.classList.remove('show');
                iosSeekOverlay.setAttribute('aria-hidden', 'true');
                return;
            }

            const shouldShow = !isVideoInFullscreen();
            iosSeekOverlay.classList.toggle('show', shouldShow);
            iosSeekOverlay.setAttribute('aria-hidden', shouldShow ? 'false' : 'true');
        }

        if (useCustomInlineSeek) {
            videoEl.controls = true;
            iosSeekRange.addEventListener('input', () => {
                isSeekingWithOverlay = true;
                const duration = Number(videoEl.duration) || 0;
                if (duration <= 0) return;

                const ratio = Math.max(0, Math.min(1000, Number(iosSeekRange.value) || 0)) / 1000;
                const nextTime = ratio * duration;
                iosSeekCurrent.textContent = formatPlaybackClock(nextTime);
            });

            const commitOverlaySeek = () => {
                const duration = Number(videoEl.duration) || 0;
                if (duration > 0) {
                    const ratio = Math.max(0, Math.min(1000, Number(iosSeekRange.value) || 0)) / 1000;
                    videoEl.currentTime = ratio * duration;
                }
                isSeekingWithOverlay = false;
                syncCustomSeekUi();
            };

            iosSeekRange.addEventListener('change', commitOverlaySeek);
            iosSeekRange.addEventListener('pointerup', commitOverlaySeek);
            iosSeekRange.addEventListener('touchend', commitOverlaySeek, { passive: true });

            videoEl.addEventListener('timeupdate', syncCustomSeekUi);
            videoEl.addEventListener('loadedmetadata', syncCustomSeekUi);
            videoEl.addEventListener('durationchange', syncCustomSeekUi);
            videoEl.addEventListener('play', syncCustomSeekUi);

            document.addEventListener('fullscreenchange', updateCustomSeekVisibility);
            document.addEventListener('webkitfullscreenchange', updateCustomSeekVisibility);
            videoEl.addEventListener('webkitbeginfullscreen', updateCustomSeekVisibility);
            videoEl.addEventListener('webkitendfullscreen', updateCustomSeekVisibility);
            window.addEventListener('orientationchange', () => {
                updateCustomSeekVisibility();
                syncCustomSeekUi();
            });

            updateCustomSeekVisibility();
            syncCustomSeekUi();
        }

        // RESUME ENGINE CORE STATES
        let currentMediaId = movieId; // Fallback to raw ID for movies
        let lastSavedTime = 0;
        const SYNC_INTERVAL_MS = 5000; 
        const activeUserProfile = document.cookie
            .split('; ')
            .find(row => row.startsWith('user_profile='))
            ?.split('=')[1] || 'guest';
        // Update the Back Button dynamically if viewing a TV show to return to the Show details page
        if (movieId && seasonParam) {
            backBtn.href = `series.html?id=${encodeURIComponent(movieId)}`;
            backBtn.innerText = "⏮ Back to Show";
        }

        function buildContextQuery() {
            const query = new URLSearchParams();
            if (seasonParam && episodeParam) {
                query.set('season', String(seasonParam));
                query.set('episode', String(episodeParam));
            }
            if (currentPlaybackFile && currentPlaybackFile !== 'remote-playback') {
                query.set('file', currentPlaybackFile);
            }
            return query;
        }

        function subtitleQueryBase() {
            return buildContextQuery().toString();
        }

        function buildPlaybackUrl() {
            const query = buildContextQuery();
            if (audioTrackSelect.value !== 'auto') {
                query.set('audioTrack', audioTrackSelect.value);
            }
            return `/api/playback/${encodeURIComponent(movieId)}${query.toString() ? `?${query.toString()}` : ''}`;
        }

        function deriveFileNameFromPath(inputPath = '') {
            const clean = String(inputPath || '').split('?')[0];
            if (clean.includes('/api/remote-playback')) return '';
            const parts = clean.split('/');
            const last = parts[parts.length - 1] || '';
            return decodeURIComponent(last);
        }

        function applyVideoSource(preservePosition = false) {
            const wasPaused = videoEl.paused;
            const previousTime = preservePosition ? videoEl.currentTime : 0;

            videoEl.src = currentRemoteStreamUrl || buildPlaybackUrl();

            if (preservePosition) {
                videoEl.addEventListener('loadedmetadata', () => {
                    if (Number.isFinite(previousTime) && previousTime > 0) {
                        videoEl.currentTime = previousTime;
                    }
                    if (!wasPaused) {
                        videoEl.play().catch(() => {});
                    }
                }, { once: true });
            }
        }

        async function refreshAudioTracks() {
            audioTracks = [];
            audioTrackSelect.innerHTML = '<option value="auto">Audio: Auto</option>';
            audioTrackSelect.disabled = true;

            if (currentRemoteStreamUrl) {
                return;
            }

            try {
                const baseQuery = buildContextQuery().toString();
                const res = await fetch(`/api/audio-tracks/${encodeURIComponent(movieId)}${baseQuery ? `?${baseQuery}` : ''}`);
                if (!res.ok) return;

                const data = await res.json();
                if (!data.success || !Array.isArray(data.tracks)) return;

                audioTracks = data.tracks;
                data.tracks.forEach(track => {
                    const option = document.createElement('option');
                    option.value = String(track.streamIndex);
                    option.textContent = track.label || `Audio ${track.streamIndex}`;
                    audioTrackSelect.appendChild(option);
                });

                const selected = String(audioTrackSelect.value || 'auto');
                const stillExists = selected === 'auto' || data.tracks.some(t => String(t.streamIndex) === selected);
                if (!stillExists) {
                    audioTrackSelect.value = 'auto';
                }

                audioTrackSelect.disabled = data.tracks.length <= 1;
            } catch (_err) {
                // Keep playback resilient if audio track discovery fails.
            }
        }

        async function refreshSubtitleTracks() {
            subtitleTracks = [];
            subtitleTrackSelect.innerHTML = '<option value="auto">Subtitles: Auto</option><option value="off">Subtitles: Off</option>';

            try {
                const baseQuery = subtitleQueryBase();
                const res = await fetch(`/api/subtitles/${encodeURIComponent(movieId)}/tracks${baseQuery ? `?${baseQuery}` : ''}`);
                if (!res.ok) return;

                const data = await res.json();
                if (!data.success || !Array.isArray(data.tracks)) return;

                subtitleTracks = data.tracks;
                data.tracks.forEach(track => {
                    const option = document.createElement('option');
                    option.value = String(track.id);
                    option.textContent = track.label || `Track ${track.id}`;
                    subtitleTrackSelect.appendChild(option);
                });
            } catch (_err) {
                // Keep player resilient if subtitle manifest fetch fails.
            }
        }

        // --- Subtitle Ingestion Function ---
        function loadSubtitles() {
            const existingTracks = videoEl.querySelectorAll('track');
            existingTracks.forEach(track => track.remove());

            if (subtitleTrackSelect.value === 'off') return;

            const track = document.createElement('track');
            track.kind = 'subtitles';
            track.label = 'English';
            track.srclang = 'en';
            const params = new URLSearchParams(subtitleQueryBase());
            if (subtitleTrackSelect.value !== 'auto') {
                params.set('track', subtitleTrackSelect.value);
            }
            const subtitleQuery = params.toString();
            track.src = `/api/subtitles/${encodeURIComponent(movieId)}${subtitleQuery ? `?${subtitleQuery}` : ''}`;
            track.default = true; 
            
            videoEl.appendChild(track);
        }

        subtitleTrackSelect.addEventListener('change', () => {
            loadSubtitles();
        });

        audioTrackSelect.addEventListener('change', () => {
            if (currentRemoteStreamUrl) return;
            applyVideoSource(true);
            loadSubtitles();
        });

        // --- Playback Sync Loop Functions ---
        async function applyResumeMarker() {
            try {
                const res = await fetch(`/api/profile/playback/state?mediaId=${encodeURIComponent(currentMediaId)}`, {
                    headers: { 'x-user-profile': activeUserProfile }
                });
                const data = await res.json();
                
                if (data.success && data.position > 5) {
                    // Only apply if user didn't complete the track down to the final 30 seconds
                    if (videoEl.duration && data.position < videoEl.duration - 30) {
                        videoEl.currentTime = data.position;
                        console.log(`▶️ Playback restored to location timestamp: ${data.position}s`);
                    } else if (!videoEl.duration) {
                        // Fallback constraint case check if metadata speed lagged behind slightly
                        videoEl.currentTime = data.position;
                    }
                }
            } catch (e) {
                console.error("Playback tracking check sync dropped:", e);
            }
        }

        // Send a continuous heartbeat tick down to the file server pipeline
        videoEl.addEventListener('timeupdate', () => {
            const currentTime = videoEl.currentTime;
            const now = Date.now();

            if (now - lastSavedTime > SYNC_INTERVAL_MS) {
                lastSavedTime = now;
                
                fetch('/api/profile/playback/sync', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'x-user-profile': activeUserProfile
                    },
                    body: JSON.stringify({
                        mediaId: currentMediaId,
                        position: currentTime
                    })
                }).catch(err => console.error("Heartbeat frame update fail:", err));
            }
        });

        // Trigger timestamp restorations right as the stream asset tracks align completely
        videoEl.addEventListener('loadedmetadata', applyResumeMarker);

        async function initializePremiumStream() {
            if (!movieId) {
                alert("No media identifier provided.");
                window.location.href = "/";
                return;
            }

            if (seasonParam && episodeParam) {
                try {
                    const cleanFolder = movieId.replace('series/', '');
                    const response = await fetch(`/api/series/${encodeURIComponent(cleanFolder)}`);
                    const showData = await response.json();
                    
                    const targetSeason = showData.seasons ? showData.seasons[seasonParam] : null;
                    currentTvPlaylist = targetSeason ? targetSeason.episodes : [];
                    currentTrackIndex = currentTvPlaylist.findIndex(ep => ep.episodeNumber == parseInt(episodeParam, 10));

                    if (currentTrackIndex !== -1) {
                        playEpisodeIndex(currentTrackIndex);
                    } else {
                        alert("Target episode track index bounds out of file system alignment.");
                    }
                } catch (err) {
                    console.error("TV context initialization fault:", err);
                }
                return;
            }

            // Standard Movie Fallback Pass
            nextBtn.style.display = 'none';
            currentMediaId = movieId; // Base context movie fallback tag setup
            setupMoviePlayback();
        }

        async function setupMoviePlayback() {
                let speedMbps = 10;
                if (navigator.connection && navigator.connection.downlink) speedMbps = navigator.connection.downlink;

                try {
                    const response = await fetch(`/api/movies/${movieId}`);
                    const movie = await response.json();
                    let targetStreamUrl = '';
                    
                    // Helper function to safely map local assets without touching cloud signatures
                    const resolveStreamSource = (fileUrl) => {
                        if (!fileUrl) return '';
                        // Direct object storage playback to avoid relaying traffic through the app server.
                        if (fileUrl.startsWith('http://') || fileUrl.startsWith('https://')) {
                            return fileUrl;
                        }
                        // Fallback: If it's a local relative file path, map it to the static server mount
                        return fileUrl.replace('/movies/', '/movie-assets/');
                    };

                    if (speedMbps < 2.5 && movie.file480p) {
                        targetStreamUrl = resolveStreamSource(movie.file480p);
                        qualityTag.innerText = "SD 480P (LOW BANDWIDTH)";
                    } else if (speedMbps < 6.0 && movie.file720p) {
                        targetStreamUrl = resolveStreamSource(movie.file720p);
                        qualityTag.innerText = "HD 720P (BALANCED)";
                    } else {
                        const fallbackFile = movie.file1080p || movie.fileSource || '';
                        targetStreamUrl = resolveStreamSource(fallbackFile);
                        qualityTag.innerText = "FHD 1080P (SOURCE)";
                    }

                    if (/^https?:\/\//i.test(targetStreamUrl)) {
                        currentRemoteStreamUrl = targetStreamUrl;
                        currentPlaybackFile = '';
                        audioTrackSelect.value = 'auto';
                        audioTrackSelect.disabled = true;
                    } else {
                        currentRemoteStreamUrl = '';
                        currentPlaybackFile = deriveFileNameFromPath(targetStreamUrl);
                    }

                    applyVideoSource(false);
                    await refreshAudioTracks();
                    await refreshSubtitleTracks();
                    loadSubtitles();
                    videoEl.play().catch(() => {});
                } catch (err) {
                    qualityTag.innerText = "STREAM CORRUPTED";
                }
}

        /**
         * Finds the index of the next available episode file in the sequence matrix
         */
        function getNextAvailableIndex() {
            if (currentTrackIndex === -1 || currentTvPlaylist.length === 0) return -1;
            for (let i = currentTrackIndex + 1; i < currentTvPlaylist.length; i++) {
                if (currentTvPlaylist[i].available) return i;
            }
            return -1;
        }

        /**
         * TV Playback Worker Logic Engine
         */
        function playEpisodeIndex(index) {
            if (index < 0 || index >= currentTvPlaylist.length) return;
            
            const episode = currentTvPlaylist[index];
            currentTrackIndex = index;
            episodeParam = String(episode.episodeNumber);
            currentPlaybackFile = deriveFileNameFromPath(episode.localRelativePath || '');
            currentRemoteStreamUrl = '';
            audioTrackSelect.value = 'auto';

            // Generate deterministic string for unique TV episode tracking arrays
            const cleanFolder = movieId.replace('series/', '');
            currentMediaId = `${cleanFolder}-S${seasonParam}E${episode.episodeNumber}`;

            applyVideoSource(false);
            qualityTag.innerText = `TV: S${seasonParam}E${episode.episodeNumber}`;
            qualityTag.style.background = "#6366f1"; 

            const newUrl = `player.html?id=${encodeURIComponent(movieId)}&season=${seasonParam}&episode=${episode.episodeNumber}`;
            window.history.replaceState({ path: newUrl }, '', newUrl);

            // Update Visibility status check on the skip layout element
            updateNextButtonVisibility();

            // Fire an explicit lookup payload fetch immediately for the new episode target profile
            applyResumeMarker();

            // Reload audio/subtitle tracks for selected episode
            refreshAudioTracks();

            // Reload subtitle track for the selected episode
            refreshSubtitleTracks().then(() => loadSubtitles());

            videoEl.play().catch(() => {});
        }

        function updateNextButtonVisibility() {
            if (getNextAvailableIndex() !== -1) {
                nextBtn.style.display = 'flex';
            } else {
                nextBtn.style.display = 'none'; // Clear from view on the absolute last episode
            }
        }

        // Wire manual skip click directly to layout element
        nextBtn.addEventListener('click', () => {
            const nextIdx = getNextAvailableIndex();
            if (nextIdx !== -1) {
                console.log("⏭️ Manual episode skip intercept triggered.");
                playEpisodeIndex(nextIdx);
            }
        });

        // Autoplay continuous sequence tracking logic 
        videoEl.addEventListener('ended', () => {
            const nextIdx = getNextAvailableIndex();
            if (nextIdx !== -1) {
                playEpisodeIndex(nextIdx);
            } else {
                qualityTag.innerText = "SEASON ENDED";
                qualityTag.style.background = "#22c55e";
            }
        });

        // Custom UI Polish: Include nextBtn in the visibility fade wrapper array structures
        let mouseMoveTimeout;
        function resetControlVisibility() {
            if (isTouchDevice) {
                backBtn.classList.remove('hide-controls');
                nextBtn.classList.remove('hide-controls');
                qualityTag.classList.remove('hide-controls');
                stage.style.cursor = 'default';
                return;
            }

            backBtn.classList.remove('hide-controls');
            nextBtn.classList.remove('hide-controls');
            qualityTag.classList.remove('hide-controls');
            stage.style.cursor = 'default';
            
            clearTimeout(mouseMoveTimeout);
            if (!videoEl.paused) {
                mouseMoveTimeout = setTimeout(() => {
                    backBtn.classList.add('hide-controls');
                    nextBtn.classList.add('hide-controls');
                    qualityTag.classList.add('hide-controls');
                    stage.style.cursor = 'none';
                }, 3000); 
            }
        }

        document.addEventListener('mousemove', resetControlVisibility);
        document.addEventListener('touchstart', resetControlVisibility, { passive: true });
        videoEl.addEventListener('play', resetControlVisibility);
        videoEl.addEventListener('pause', resetControlVisibility);

        // Keyboard Intercept Controls
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault(); 
                if (videoEl.paused) videoEl.play(); else videoEl.pause();
            }
            // Added quick keyboard hotkey alternative: 'N' steps to next track profile
            if (e.key.toLowerCase() === 'n') {
                const nextIdx = getNextAvailableIndex();
                if (nextIdx !== -1) playEpisodeIndex(nextIdx);
            }
        });

        initializePremiumStream();
    </script>
</body>
</html>
