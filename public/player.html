<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joshflix Player</title>
    <link rel="stylesheet" href="/vendor/video.js/video-js.min.css">
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #020617; /* Deep cinema black-blue */
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
        }

        /* Seamless Edge-to-Edge Player */
        .player-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-js {
            width: 100%;
            height: 100%;
        }

        .video-js video {
            object-fit: contain; /* Preserves original movie aspect ratios perfectly */
        }

        /* Premium Floating Overlay Back Button */
        .back-overlay-btn {
            position: absolute;
            top: 24px;
            left: 24px;
            z-index: 20;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #f1f5f9;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            opacity: 0.3; /* Subtle presence until hovered */
        }

        .back-overlay-btn:hover {
            opacity: 1;
            background: rgba(15, 23, 42, 0.9);
            transform: translateX(-2px);
        }

        /* Quality Indicator Tag - top-anchored so it never collides with
           the Video.js control bar that now permanently occupies the
           bottom of the player. */
        .quality-badge {
            position: absolute;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            background: rgba(229, 9, 20, 0.8); /* Joshflix Red */
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            letter-spacing: 0.5px;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        /* Fade utilities for overlay elements when mouse is still */
        .hide-controls {
            opacity: 0 !important;
        }
        /* Premium Floating Overlay Next Button */
        .next-overlay-btn {
            position: absolute;
            top: 24px;
            right: 24px;
            z-index: 20;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #f1f5f9;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            opacity: 0.3;
        }

        .next-overlay-btn:hover {
            opacity: 1;
            background: rgba(15, 23, 42, 0.9);
            transform: translateX(2px);
        }

        .info-overlay-btn {
            position: absolute;
            top: 24px;
            right: 170px;
            z-index: 20;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.16);
            color: #f1f5f9;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.84rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            opacity: 0.34;
        }

        .info-overlay-btn:hover {
            opacity: 1;
            background: rgba(15, 23, 42, 0.94);
        }

        .player-info-drawer {
            position: absolute;
            top: 0;
            right: 0;
            height: 100%;
            width: min(460px, 92vw);
            z-index: 30;
            transform: translateX(102%);
            transition: transform 0.25s ease;
            background: linear-gradient(180deg, rgba(2, 6, 23, 0.95), rgba(15, 23, 42, 0.92));
            border-left: 1px solid rgba(148, 163, 184, 0.28);
            display: flex;
            flex-direction: column;
            pointer-events: none;
            backdrop-filter: blur(8px);
        }

        .player-info-drawer.show {
            transform: translateX(0);
            pointer-events: auto;
        }

        .player-info-head {
            padding: 16px 16px 10px 16px;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            border-bottom: 1px solid rgba(51, 65, 85, 0.7);
        }

        .player-info-kicker {
            font-size: 0.72rem;
            font-weight: 800;
            color: #93c5fd;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .player-info-title {
            margin: 4px 0 2px 0;
            color: #f8fafc;
            font-size: 1.03rem;
            line-height: 1.25;
        }

        .player-info-sub {
            color: #94a3b8;
            font-size: 0.75rem;
        }

        .player-info-close {
            width: 30px;
            height: 30px;
            border: 1px solid rgba(100, 116, 139, 0.8);
            border-radius: 999px;
            background: rgba(15, 23, 42, 0.8);
            color: #e2e8f0;
            font-size: 1rem;
            cursor: pointer;
            flex: 0 0 auto;
        }

        .player-info-content {
            padding: 12px 16px 18px 16px;
            overflow: auto;
            display: grid;
            gap: 12px;
        }

        .player-info-synopsis {
            color: #e2e8f0;
            font-size: 0.84rem;
            line-height: 1.5;
        }

        .player-info-group {
            border: 1px solid rgba(51, 65, 85, 0.7);
            border-radius: 10px;
            padding: 10px;
            background: rgba(15, 23, 42, 0.58);
        }

        .player-info-label {
            color: #94a3b8;
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .player-info-value {
            color: #f8fafc;
            font-size: 0.78rem;
            line-height: 1.4;
        }

        .player-rating-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .player-rating-chip {
            border: 1px solid rgba(51, 65, 85, 0.9);
            border-radius: 999px;
            padding: 6px 10px;
            color: #f8fafc;
            text-decoration: none;
            font-size: 0.72rem;
            font-weight: 700;
            background: rgba(15, 23, 42, 0.7);
        }

        .player-rating-chip:hover {
            border-color: #93c5fd;
            color: #dbeafe;
        }

        .player-trailer-cta {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            background: #b91c1c;
            color: #fff;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 0.78rem;
            font-weight: 800;
            width: fit-content;
        }

        .player-trailer-cta:hover {
            background: #dc2626;
        }

        @supports (padding: env(safe-area-inset-bottom)) {
            .back-overlay-btn,
            .next-overlay-btn,
            .quality-badge {
                margin-bottom: env(safe-area-inset-bottom);
            }
        }

        @media (hover: none) and (pointer: coarse) {
            .back-overlay-btn,
            .next-overlay-btn {
                top: 16px;
                opacity: 0.82;
            }

            .info-overlay-btn {
                top: 62px;
                right: 16px;
                opacity: 0.82;
            }

            .quality-badge {
                top: 16px;
            }
        }

        /* ==================== Video.js re-skin ====================
           Match the app's existing dark-cinema look (deep navy/black,
           Joshflix red accent, glassmorphism buttons) instead of the
           default Video.js skin. */
        .video-js .vjs-big-play-button {
            background-color: rgba(15, 23, 42, 0.6);
            border-color: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            border-radius: 50%;
            width: 2.2em;
            height: 2.2em;
            line-height: 2.2em;
        }

        .video-js:hover .vjs-big-play-button,
        .video-js .vjs-big-play-button:focus {
            background-color: rgba(229, 9, 20, 0.85);
            border-color: rgba(255, 255, 255, 0.35);
        }

        .video-js .vjs-control-bar {
            background: linear-gradient(180deg, rgba(2, 6, 23, 0) 0%, rgba(2, 6, 23, 0.75) 45%, rgba(2, 6, 23, 0.92) 100%);
            font-size: 14px;
        }

        .video-js .vjs-play-progress,
        .video-js .vjs-volume-level {
            background-color: #e50914;
        }

        .video-js .vjs-slider {
            background-color: rgba(255, 255, 255, 0.2);
        }

        .video-js .vjs-load-progress {
            background: rgba(255, 255, 255, 0.25);
        }

        .video-js .vjs-menu-button-popup .vjs-menu .vjs-menu-content {
            background-color: rgba(15, 23, 42, 0.94);
            backdrop-filter: blur(8px);
        }

        .video-js .vjs-menu li.vjs-menu-item.vjs-selected,
        .video-js .vjs-menu li.vjs-menu-item.vjs-selected:focus,
        .video-js .vjs-menu li.vjs-menu-item.vjs-selected:hover {
            background-color: rgba(229, 9, 20, 0.35);
            color: #fff;
        }

        .video-js .vjs-menu li.vjs-menu-item:focus,
        .video-js .vjs-menu li.vjs-menu-item:hover {
            background-color: rgba(148, 163, 184, 0.2);
        }
    </style>
</head>
<body>

    <div class="player-container" id="stage">
        <a href="/" class="back-overlay-btn" id="backBtn">⏮ Back to Show</a>
        <button class="next-overlay-btn hide-controls" id="nextBtn">Next Episode ⏭</button>
        <button class="info-overlay-btn hide-controls" id="infoBtn" type="button">ℹ Info</button>

        <div class="quality-badge" id="qualityTag">DETECTING...</div>
        <video id="cinemaVideo" class="video-js vjs-big-play-centered" autoplay playsinline webkit-playsinline preload="metadata" crossorigin="anonymous"></video>

        <aside class="player-info-drawer" id="playerInfoDrawer" aria-hidden="true">
            <header class="player-info-head">
                <div>
                    <div class="player-info-kicker" id="playerInfoKicker">Media</div>
                    <h3 class="player-info-title" id="playerInfoTitle">Loading details...</h3>
                    <div class="player-info-sub" id="playerInfoSub"></div>
                </div>
                <button type="button" class="player-info-close" id="playerInfoClose" aria-label="Close details">×</button>
            </header>
            <section class="player-info-content">
                <div class="player-info-synopsis" id="playerInfoSynopsis">Loading synopsis...</div>
                <div class="player-info-group">
                    <div class="player-info-label">Actors</div>
                    <div class="player-info-value" id="playerInfoActors">Not available</div>
                </div>
                <div class="player-info-group">
                    <div class="player-info-label">Writers</div>
                    <div class="player-info-value" id="playerInfoWriters">Not available</div>
                </div>
                <div class="player-info-group">
                    <div class="player-info-label">Director</div>
                    <div class="player-info-value" id="playerInfoDirectors">Not available</div>
                </div>
                <div class="player-rating-row" id="playerInfoRatings"></div>
                <a id="playerInfoTrailer" class="player-trailer-cta" href="#" target="_blank" rel="noopener noreferrer" style="display:none;">▶ Watch Trailer</a>
            </section>
        </aside>
    </div>

    <script src="/vendor/video.js/video.min.js"></script>
    <script>
        // 1. Declare URL Params FIRST so they are available to everything below
        const params = new URLSearchParams(window.location.search);
        const movieId = params.get('id');
        let seasonParam = params.get('season');
        let episodeParam = params.get('episode');

        // 2. Initialize UI Element References and State Trackers
        let currentTvPlaylist = [];
        let currentTrackIndex = -1;
        const qualityTag = document.getElementById('qualityTag');
        const backBtn = document.getElementById('backBtn');
        const nextBtn = document.getElementById('nextBtn');
        const infoBtn = document.getElementById('infoBtn');
        const playerInfoDrawer = document.getElementById('playerInfoDrawer');
        const playerInfoClose = document.getElementById('playerInfoClose');
        const stage = document.getElementById('stage');
        const isTouchDevice = window.matchMedia('(hover: none) and (pointer: coarse)').matches;
        let audioTracks = [];
        let lastAppliedAudioTrack = 'auto';
        let subtitleTracks = [];
        let currentPlaybackFile = '';
        let currentRemoteStreamUrl = '';
        let allowLocalFallbackMode = false;
        let cloudFallbackFile = '';
        let remoteFallbackTriggered = false;

        function joinPeopleList(items = []) {
            return Array.isArray(items) && items.length > 0
                ? items.map(item => String(item || '').trim()).filter(Boolean).join(', ')
                : 'Not available';
        }

        function makePlayerRatingChip(label, score, href) {
            const safeLabel = String(label || '').trim();
            const safeScore = String(score || '').trim() || 'N/A';
            const safeHref = String(href || '').trim();

            if (/^https?:\/\//i.test(safeHref)) {
                return `<a class="player-rating-chip" href="${safeHref}" target="_blank" rel="noopener noreferrer">${safeLabel} · ${safeScore}</a>`;
            }
            return `<span class="player-rating-chip">${safeLabel} · ${safeScore}</span>`;
        }

        function setPlayerDetailsLoadingState(title = 'Loading details...') {
            const titleEl = document.getElementById('playerInfoTitle');
            const subEl = document.getElementById('playerInfoSub');
            const synopsisEl = document.getElementById('playerInfoSynopsis');
            const actorsEl = document.getElementById('playerInfoActors');
            const writersEl = document.getElementById('playerInfoWriters');
            const directorsEl = document.getElementById('playerInfoDirectors');
            const ratingsEl = document.getElementById('playerInfoRatings');
            const trailerEl = document.getElementById('playerInfoTrailer');

            if (titleEl) titleEl.textContent = title;
            if (subEl) subEl.textContent = '';
            if (synopsisEl) synopsisEl.textContent = 'Loading synopsis...';
            if (actorsEl) actorsEl.textContent = 'Not available';
            if (writersEl) writersEl.textContent = 'Not available';
            if (directorsEl) directorsEl.textContent = 'Not available';
            if (ratingsEl) ratingsEl.innerHTML = '';
            if (trailerEl) {
                trailerEl.style.display = 'none';
                trailerEl.href = '#';
            }
        }

        function renderPlayerDetails(details = {}) {
            const kickerEl = document.getElementById('playerInfoKicker');
            const titleEl = document.getElementById('playerInfoTitle');
            const subEl = document.getElementById('playerInfoSub');
            const synopsisEl = document.getElementById('playerInfoSynopsis');
            const actorsEl = document.getElementById('playerInfoActors');
            const writersEl = document.getElementById('playerInfoWriters');
            const directorsEl = document.getElementById('playerInfoDirectors');
            const ratingsEl = document.getElementById('playerInfoRatings');
            const trailerEl = document.getElementById('playerInfoTrailer');

            const typeLabel = String(details.contentType || '').toLowerCase() === 'series' ? 'TV Series' : 'Movie';
            const subline = [details.year || '', details.genre || ''].filter(Boolean).join(' · ');

            if (kickerEl) kickerEl.textContent = typeLabel;
            if (titleEl) titleEl.textContent = details.title || 'Untitled';
            if (subEl) subEl.textContent = subline;
            if (synopsisEl) synopsisEl.textContent = details?.synopsis?.full || details?.synopsis?.short || 'Synopsis is not available yet for this title.';
            if (actorsEl) actorsEl.textContent = joinPeopleList(details?.credits?.actors || []);
            if (writersEl) writersEl.textContent = joinPeopleList(details?.credits?.writers || []);
            if (directorsEl) directorsEl.textContent = joinPeopleList(details?.credits?.directors || []);

            if (ratingsEl) {
                const imdb = details?.ratings?.imdb || {};
                const rotten = details?.ratings?.rottenTomatoes || {};
                ratingsEl.innerHTML = `${makePlayerRatingChip('IMDb', imdb.score, imdb.url)}${makePlayerRatingChip('Rotten Tomatoes', rotten.score, rotten.url)}`;
            }

            const trailerUrl = String(details?.trailer?.url || details?.links?.trailer || '').trim();
            if (trailerEl) {
                if (/^https?:\/\//i.test(trailerUrl)) {
                    trailerEl.href = trailerUrl;
                    trailerEl.style.display = 'inline-flex';
                } else {
                    trailerEl.href = '#';
                    trailerEl.style.display = 'none';
                }
            }
        }

        async function loadPlayerDetails() {
            if (!movieId) return;

            const contentType = (seasonParam && episodeParam) || String(movieId).startsWith('series/') ? 'series' : 'movie';
            setPlayerDetailsLoadingState();
            try {
                const query = new URLSearchParams({
                    id: movieId,
                    type: contentType
                });
                const response = await fetch(`/api/media/details?${query.toString()}`);
                const payload = await response.json();
                if (!payload?.success || !payload?.details) {
                    throw new Error(payload?.error || 'Details not available.');
                }
                renderPlayerDetails(payload.details);
            } catch (_err) {
                setPlayerDetailsLoadingState('Details unavailable');
                const synopsisEl = document.getElementById('playerInfoSynopsis');
                if (synopsisEl) synopsisEl.textContent = 'Unable to load metadata details for this title right now.';
            }
        }

        function openPlayerInfoDrawer() {
            if (!playerInfoDrawer) return;
            playerInfoDrawer.classList.add('show');
            playerInfoDrawer.setAttribute('aria-hidden', 'false');
        }

        function closePlayerInfoDrawer() {
            if (!playerInfoDrawer) return;
            playerInfoDrawer.classList.remove('show');
            playerInfoDrawer.setAttribute('aria-hidden', 'true');
        }

        function initPlayerInfoDrawer() {
            if (infoBtn) {
                infoBtn.addEventListener('click', () => {
                    const isOpen = playerInfoDrawer && playerInfoDrawer.classList.contains('show');
                    if (isOpen) closePlayerInfoDrawer();
                    else openPlayerInfoDrawer();
                });
            }

            if (playerInfoClose) {
                playerInfoClose.addEventListener('click', closePlayerInfoDrawer);
            }
        }

        const activeUserProfile = document.cookie
            .split('; ')
            .find(row => row.startsWith('user_profile='))
            ?.split('=')[1] || 'guest';

        // ==================== Custom Video.js Audio Track menu ====================
        // Video.js's native AudioTrackButton only reflects the browser's native
        // multi-audio-track API (used for HLS alternate-audio renditions) - it
        // doesn't actually switch anything. This app's audio-track switching is
        // server-side remuxing on demand, so it needs its own component that
        // calls back into switchAudioTrack() below. Modeled directly on Video.js's
        // own PlaybackRateMenuButton/PlaybackRateMenuItem pattern.
        const MenuButton = videojs.getComponent('MenuButton');
        const MenuItem = videojs.getComponent('MenuItem');

        class AudioTrackMenuItemCustom extends MenuItem {
            constructor(player, options) {
                super(player, {
                    ...options,
                    selectable: true,
                    multiSelectable: false
                });
                this.trackValue = options.trackValue;
            }
            handleClick(event) {
                super.handleClick(event);
                switchAudioTrack(this.trackValue);
            }
        }
        videojs.registerComponent('AudioTrackMenuItemCustom', AudioTrackMenuItemCustom);

        class AudioTrackMenuButtonCustom extends MenuButton {
            constructor(player, options) {
                super(player, options);
                this.hideThreshold_ = 1;
                this.controlText('Audio Track');
                // Capture the instance directly rather than looking it up later via
                // getChild() by name - Video.js indexes children under a couple of
                // case-converted variants of their name and it's easy to reference
                // the wrong one; this sidesteps that entirely.
                audioTrackMenuButtonInstance = this;
                this.update();
            }
            buildCSSClass() {
                return `vjs-audio-button ${super.buildCSSClass()}`;
            }
            createItems() {
                const items = [new AudioTrackMenuItemCustom(this.player(), {
                    label: 'Auto',
                    trackValue: 'auto',
                    selected: lastAppliedAudioTrack === 'auto'
                })];
                audioTracks.forEach((track) => {
                    const value = String(track.streamIndex);
                    items.push(new AudioTrackMenuItemCustom(this.player(), {
                        label: track.label || `Audio ${track.streamIndex}`,
                        trackValue: value,
                        selected: lastAppliedAudioTrack === value
                    }));
                });
                return items;
            }
        }
        videojs.registerComponent('AudioTrackMenuButtonCustom', AudioTrackMenuButtonCustom);

        // ==================== Player init ====================
        const player = videojs('cinemaVideo', {
            controls: true,
            autoplay: true,
            preload: 'metadata',
            playsinline: true,
            fluid: false,
            controlBar: {
                children: [
                    'playToggle',
                    'skipBackward',
                    'skipForward',
                    'volumePanel',
                    'currentTimeDisplay',
                    'timeDivider',
                    'durationDisplay',
                    'progressControl',
                    'customControlSpacer',
                    'subsCapsButton',
                    'audioTrackMenuButtonCustom',
                    'pictureInPictureToggle',
                    'fullscreenToggle'
                ]
            }
        });
        player.el().setAttribute('data-vjs-player', 'true');

        function formatPlaybackClock(totalSeconds = 0) {
            const secs = Math.max(0, Math.floor(Number(totalSeconds) || 0));
            const hours = Math.floor(secs / 3600);
            const mins = Math.floor((secs % 3600) / 60);
            const rem = secs % 60;
            if (hours > 0) {
                return `${hours}:${String(mins).padStart(2, '0')}:${String(rem).padStart(2, '0')}`;
            }
            return `${mins}:${String(rem).padStart(2, '0')}`;
        }

        // RESUME ENGINE CORE STATES
        let currentMediaId = movieId; // Fallback to raw ID for movies
        let lastSavedTime = 0;
        const SYNC_INTERVAL_MS = 5000;
        // Most viewing sessions never reach the video's literal 'ended' event
        // (closed tab, long credits, network drop) - so a title is also
        // considered finished once watched past this fraction, not just on
        // native end-of-file.
        const FINISHED_PERCENT = 0.9;
        let hasMarkedCurrentTitleFinished = false;

        function markCurrentTitleFinished(mediaId) {
            if (hasMarkedCurrentTitleFinished) return;
            hasMarkedCurrentTitleFinished = true;
            fetch('/api/profile/playback/complete', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'x-user-profile': activeUserProfile
                },
                body: JSON.stringify({ mediaId })
            }).catch(err => console.error("Playback completion clear failed:", err));
        }

        // Update the Back Button dynamically if viewing a TV show to return to the Show details page
        if (movieId && seasonParam) {
            backBtn.href = `series.html?id=${encodeURIComponent(movieId)}`;
            backBtn.innerText = "⏮ Back to Show";
        }

        function buildContextQuery() {
            const query = new URLSearchParams();
            if (seasonParam && episodeParam) {
                query.set('season', String(seasonParam));
                query.set('episode', String(episodeParam));
            }
            if (currentPlaybackFile && currentPlaybackFile !== 'remote-playback') {
                query.set('file', currentPlaybackFile);
            }
            if (allowLocalFallbackMode) {
                query.set('allowLocalFallback', '1');
            }
            return query;
        }

        function subtitleQueryBase() {
            return buildContextQuery().toString();
        }

        function buildPlaybackUrl() {
            const query = buildContextQuery();
            if (lastAppliedAudioTrack !== 'auto') {
                query.set('audioTrack', lastAppliedAudioTrack);
            }
            return `/api/playback/${encodeURIComponent(movieId)}${query.toString() ? `?${query.toString()}` : ''}`;
        }

        function deriveFileNameFromPath(inputPath = '') {
            const clean = String(inputPath || '').split('?')[0];
            if (clean.includes('/api/remote-playback')) return '';
            const parts = clean.split('/');
            const last = parts[parts.length - 1] || '';
            return decodeURIComponent(last);
        }

        function applyVideoSource(preservePosition = false) {
            const wasPaused = player.paused();
            const previousTime = preservePosition ? player.currentTime() : 0;

            player.src({ src: currentRemoteStreamUrl || buildPlaybackUrl(), type: 'video/mp4' });

            if (preservePosition) {
                player.one('loadedmetadata', () => {
                    if (Number.isFinite(previousTime) && previousTime > 0) {
                        player.currentTime(previousTime);
                    }
                    if (!wasPaused) {
                        player.play().catch(() => {});
                    }
                });
            }
        }

        let audioTrackMenuButtonInstance = null;

        async function refreshAudioTracks() {
            audioTracks = [];
            lastAppliedAudioTrack = 'auto';

            if (!currentRemoteStreamUrl) {
                try {
                    const baseQuery = buildContextQuery().toString();
                    const res = await fetch(`/api/audio-tracks/${encodeURIComponent(movieId)}${baseQuery ? `?${baseQuery}` : ''}`);
                    if (res.ok) {
                        const data = await res.json();
                        if (data.success && Array.isArray(data.tracks)) {
                            audioTracks = data.tracks;
                        }
                    }
                } catch (_err) {
                    // Keep playback resilient if audio track discovery fails.
                }
            }

            if (audioTrackMenuButtonInstance) {
                audioTrackMenuButtonInstance.update();
            }
        }

        async function refreshSubtitleTracks() {
            subtitleTracks = [];
            try {
                const baseQuery = subtitleQueryBase();
                const res = await fetch(`/api/subtitles/${encodeURIComponent(movieId)}/tracks${baseQuery ? `?${baseQuery}` : ''}`);
                if (!res.ok) return;

                const data = await res.json();
                if (!data.success || !Array.isArray(data.tracks)) return;

                subtitleTracks = data.tracks;
            } catch (_err) {
                // Keep player resilient if subtitle manifest fetch fails.
            }
        }

        // Adds one remote text track per available subtitle option, letting
        // Video.js's native captions/subtitles menu (subsCapsButton) handle
        // selection - replaces the old single-dynamic-track-swapped-on-select
        // approach entirely. manualCleanup=false (the default) means Video.js
        // clears these automatically whenever the source changes (new episode,
        // audio track switch, etc), so no manual teardown is needed here.
        function loadSubtitles() {
            const baseParams = new URLSearchParams(subtitleQueryBase());
            subtitleTracks.forEach((track, index) => {
                const trackParams = new URLSearchParams(baseParams);
                trackParams.set('track', String(track.id));
                player.addRemoteTextTrack({
                    kind: 'subtitles',
                    src: `/api/subtitles/${encodeURIComponent(movieId)}?${trackParams.toString()}`,
                    srclang: track.language || 'en',
                    label: track.label || `Track ${track.id}`,
                    default: Boolean(track.isDefaultCandidate) && index === 0
                }, false);
            });
        }

        async function switchAudioTrack(requestedTrackValue) {
            if (currentRemoteStreamUrl) return;

            const requested = String(requestedTrackValue || 'auto');
            if (requested === lastAppliedAudioTrack) return;

            if (requested === 'auto') {
                lastAppliedAudioTrack = 'auto';
                applyVideoSource(true);
                loadSubtitles();
                if (audioTrackMenuButtonInstance) audioTrackMenuButtonInstance.update();
                return;
            }

            // The server may need to remux a fresh copy for this track. Probe first so a
            // failure reverts the selection instead of silently playing the original audio.
            const previousBadge = qualityTag.innerText;
            const previousBadgeBg = qualityTag.style.background;
            qualityTag.innerText = 'PREPARING AUDIO TRACK...';

            const previousTrack = lastAppliedAudioTrack;
            try {
                lastAppliedAudioTrack = requested;
                const probe = await fetch(buildPlaybackUrl(), { headers: { Range: 'bytes=0-1' } });
                if (!probe.ok) {
                    let detail = `Server returned ${probe.status}`;
                    try {
                        const body = await probe.json();
                        detail = body.detail || body.error || detail;
                    } catch (_parseErr) { /* non-JSON error body */ }

                    console.error('Audio track switch failed:', detail);
                    lastAppliedAudioTrack = previousTrack;
                    qualityTag.innerText = 'AUDIO TRACK UNAVAILABLE';
                    qualityTag.style.background = '#b91c1c';
                    return;
                }

                qualityTag.innerText = previousBadge;
                qualityTag.style.background = previousBadgeBg;
                applyVideoSource(true);
                loadSubtitles();
            } catch (err) {
                console.error('Audio track switch failed:', err);
                lastAppliedAudioTrack = previousTrack;
                qualityTag.innerText = 'AUDIO TRACK UNAVAILABLE';
                qualityTag.style.background = '#b91c1c';
            } finally {
                if (audioTrackMenuButtonInstance) audioTrackMenuButtonInstance.update();
            }
        }

        // --- Playback Sync Loop Functions ---
        async function applyResumeMarker() {
            try {
                const res = await fetch(`/api/profile/playback/state?mediaId=${encodeURIComponent(currentMediaId)}`, {
                    headers: { 'x-user-profile': activeUserProfile }
                });
                const data = await res.json();

                if (data.success && data.position > 5) {
                    const duration = player.duration();
                    // Only apply if user didn't complete the track down to the final 30 seconds
                    if (duration && data.position < duration - 30) {
                        player.currentTime(data.position);
                        console.log(`▶️ Playback restored to location timestamp: ${data.position}s`);
                    } else if (!duration) {
                        // Fallback constraint case check if metadata speed lagged behind slightly
                        player.currentTime(data.position);
                    }
                }
            } catch (e) {
                console.error("Playback tracking check sync dropped:", e);
            }
        }

        // Send a continuous heartbeat tick down to the file server pipeline
        player.on('timeupdate', () => {
            const currentTime = player.currentTime();
            const duration = player.duration();
            const now = Date.now();

            if (duration > 0 && (currentTime / duration) >= FINISHED_PERCENT) {
                markCurrentTitleFinished(currentMediaId);
            }

            if (now - lastSavedTime > SYNC_INTERVAL_MS) {
                lastSavedTime = now;

                fetch('/api/profile/playback/sync', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-user-profile': activeUserProfile
                    },
                    body: JSON.stringify({
                        mediaId: currentMediaId,
                        position: currentTime,
                        duration: Number.isFinite(duration) ? duration : undefined
                    })
                }).catch(err => console.error("Heartbeat frame update fail:", err));
            }
        });

        // Trigger timestamp restorations right as the stream asset tracks align completely
        player.on('loadedmetadata', applyResumeMarker);

        function resolveSubscribeReasonFromStatus(statusPayload) {
            const status = String(statusPayload?.subscriptionStatus || '').toUpperCase();
            if (status === 'TRIAL' || status === 'ACTIVE' || status === 'GRACE' || status === 'FREE_ACCESS') {
                return null;
            }

            const trialEndsAt = statusPayload?.trialEndsAt ? Date.parse(statusPayload.trialEndsAt) : NaN;
            if (Number.isFinite(trialEndsAt) && trialEndsAt <= Date.now()) {
                return 'trial_expired';
            }

            return 'access_restricted';
        }

        async function enforcePlaybackAccess() {
            try {
                const response = await fetch('/api/account/status', { credentials: 'include' });
                const statusPayload = await response.json();
                if (!response.ok || !statusPayload?.success) {
                    return true;
                }

                const reason = resolveSubscribeReasonFromStatus(statusPayload);
                if (!reason) return true;

                const params = new URLSearchParams({
                    reason,
                    from: 'player'
                });
                window.location.href = `/subscribe.html?${params.toString()}`;
                return false;
            } catch (_err) {
                return true;
            }
        }

        async function initializePremiumStream() {
            if (!movieId) {
                alert("No media identifier provided.");
                window.location.href = "/";
                return;
            }

            const canPlay = await enforcePlaybackAccess();
            if (!canPlay) return;

            if (seasonParam && episodeParam) {
                try {
                    const cleanFolder = movieId.replace('series/', '');
                    const response = await fetch(`/api/series/${encodeURIComponent(cleanFolder)}`);
                    const showData = await response.json();

                    const targetSeason = showData.seasons ? showData.seasons[seasonParam] : null;
                    currentTvPlaylist = targetSeason ? targetSeason.episodes : [];
                    currentTrackIndex = currentTvPlaylist.findIndex(ep => ep.episodeNumber == parseInt(episodeParam, 10));

                    if (currentTrackIndex !== -1) {
                        playEpisodeIndex(currentTrackIndex);
                    } else {
                        alert("Target episode track index bounds out of file system alignment.");
                    }
                } catch (err) {
                    console.error("TV context initialization fault:", err);
                }
                return;
            }

            // Standard Movie Fallback Pass
            nextBtn.style.display = 'none';
            currentMediaId = movieId; // Base context movie fallback tag setup
            hasMarkedCurrentTitleFinished = false;
            setupMoviePlayback();
        }

        async function setupMoviePlayback() {
                let speedMbps = 10;
                if (navigator.connection && navigator.connection.downlink) speedMbps = navigator.connection.downlink;

                try {
                    const response = await fetch(`/api/movies/${movieId}`);
                    const movie = await response.json();
                    let targetStreamUrl = '';
                    let localFallbackUrl = '';

                    // Helper function to safely map local assets without touching cloud signatures
                    const resolveStreamSource = (fileUrl) => {
                        if (!fileUrl) return '';
                        // Direct object storage playback to avoid relaying traffic through the app server.
                        if (fileUrl.startsWith('http://') || fileUrl.startsWith('https://')) {
                            return fileUrl;
                        }
                        // Fallback: If it's a local relative file path, map it to the static server mount
                        return fileUrl.replace('/movies/', '/movie-assets/');
                    };

                    if (speedMbps < 2.5 && movie.file480p) {
                        targetStreamUrl = resolveStreamSource(movie.file480p);
                        localFallbackUrl = resolveStreamSource(movie.localFallback480p || '');
                        qualityTag.innerText = "SD 480P (LOW BANDWIDTH)";
                    } else if (speedMbps < 6.0 && movie.file720p) {
                        targetStreamUrl = resolveStreamSource(movie.file720p);
                        localFallbackUrl = resolveStreamSource(movie.localFallback720p || movie.localFallback1080p || '');
                        qualityTag.innerText = "HD 720P (BALANCED)";
                    } else {
                        const fallbackFile = movie.file1080p || movie.fileSource || '';
                        targetStreamUrl = resolveStreamSource(fallbackFile);
                        localFallbackUrl = resolveStreamSource(movie.localFallback1080p || '');
                        qualityTag.innerText = "FHD 1080P (SOURCE)";
                    }

                    if (/^https?:\/\//i.test(targetStreamUrl)) {
                        currentRemoteStreamUrl = targetStreamUrl;
                        currentPlaybackFile = '';
                        allowLocalFallbackMode = false;
                        remoteFallbackTriggered = false;
                        cloudFallbackFile = deriveFileNameFromPath(localFallbackUrl || '');
                    } else {
                        currentRemoteStreamUrl = '';
                        allowLocalFallbackMode = movie.fallbackReason === 'remote_unavailable';
                        remoteFallbackTriggered = false;
                        cloudFallbackFile = '';
                        currentPlaybackFile = deriveFileNameFromPath(targetStreamUrl);
                    }

                    applyVideoSource(false);
                    await refreshAudioTracks();
                    await refreshSubtitleTracks();
                    loadSubtitles();
                    player.play().catch(() => {});
                } catch (err) {
                    qualityTag.innerText = "STREAM CORRUPTED";
                }
        }

        player.on('error', async () => {
            if (!currentRemoteStreamUrl || remoteFallbackTriggered || !cloudFallbackFile) {
                return;
            }

            remoteFallbackTriggered = true;
            currentRemoteStreamUrl = '';
            currentPlaybackFile = cloudFallbackFile;
            allowLocalFallbackMode = true;
            qualityTag.innerText = 'LOCAL FALLBACK (CLOUD ERROR)';
            qualityTag.style.background = '#b45309';

            applyVideoSource(false);
            await refreshAudioTracks();
            await refreshSubtitleTracks();
            loadSubtitles();
            player.play().catch(() => {});
        });

        /**
         * Finds the index of the next available episode file in the sequence matrix
         */
        function getNextAvailableIndex() {
            if (currentTrackIndex === -1 || currentTvPlaylist.length === 0) return -1;
            for (let i = currentTrackIndex + 1; i < currentTvPlaylist.length; i++) {
                if (currentTvPlaylist[i].available) return i;
            }
            return -1;
        }

        /**
         * TV Playback Worker Logic Engine
         */
        function playEpisodeIndex(index) {
            if (index < 0 || index >= currentTvPlaylist.length) return;

            const episode = currentTvPlaylist[index];
            currentTrackIndex = index;
            episodeParam = String(episode.episodeNumber);
            currentPlaybackFile = deriveFileNameFromPath(episode.localRelativePath || '');
            currentRemoteStreamUrl = '';
            // allowLocalFallbackMode is page-level state shared with movie
            // playback - reset it here or a stale `true` left over from an
            // earlier title (e.g. a cloud movie that errored and fell back)
            // silently forces every subsequent episode request to skip the
            // cloud redirect and go straight to local, with no visible error.
            allowLocalFallbackMode = false;
            lastAppliedAudioTrack = 'auto';

            // Generate deterministic string for unique TV episode tracking arrays
            const cleanFolder = movieId.replace('series/', '');
            currentMediaId = `${cleanFolder}-S${seasonParam}E${episode.episodeNumber}`;
            hasMarkedCurrentTitleFinished = false;

            applyVideoSource(false);
            qualityTag.innerText = `TV: S${seasonParam}E${episode.episodeNumber}`;
            qualityTag.style.background = "#6366f1";

            const newUrl = `player.html?id=${encodeURIComponent(movieId)}&season=${seasonParam}&episode=${episode.episodeNumber}`;
            window.history.replaceState({ path: newUrl }, '', newUrl);

            // Update Visibility status check on the skip layout element
            updateNextButtonVisibility();

            // Fire an explicit lookup payload fetch immediately for the new episode target profile
            applyResumeMarker();

            // Reload audio/subtitle tracks for selected episode
            refreshAudioTracks();

            // Reload subtitle track for the selected episode
            refreshSubtitleTracks().then(() => loadSubtitles());

            player.play().catch(() => {});
        }

        function updateNextButtonVisibility() {
            if (getNextAvailableIndex() !== -1) {
                nextBtn.style.display = 'flex';
            } else {
                nextBtn.style.display = 'none'; // Clear from view on the absolute last episode
            }
        }

        // Wire manual skip click directly to layout element
        nextBtn.addEventListener('click', () => {
            const nextIdx = getNextAvailableIndex();
            if (nextIdx !== -1) {
                console.log("⏭️ Manual episode skip intercept triggered.");
                playEpisodeIndex(nextIdx);
            }
        });

        // Autoplay continuous sequence tracking logic
        player.on('ended', () => {
            // No-op if the FINISHED_PERCENT threshold in the timeupdate
            // handler already fired for this title (the common case) -
            // markCurrentTitleFinished guards against double-firing.
            markCurrentTitleFinished(currentMediaId);

            const nextIdx = getNextAvailableIndex();
            if (nextIdx !== -1) {
                playEpisodeIndex(nextIdx);
            } else {
                qualityTag.innerText = "SEASON ENDED";
                qualityTag.style.background = "#22c55e";
            }
        });

        // Fade the custom overlay buttons (back/next/info/quality-badge) in sync
        // with Video.js's own control bar visibility, instead of running a
        // separate hand-rolled inactivity timer.
        player.on('useractive', () => {
            backBtn.classList.remove('hide-controls');
            nextBtn.classList.remove('hide-controls');
            if (infoBtn) infoBtn.classList.remove('hide-controls');
            qualityTag.classList.remove('hide-controls');
        });
        player.on('userinactive', () => {
            if (isTouchDevice) return; // keep them visible on touch devices, matching prior behavior
            if (player.paused()) return;
            backBtn.classList.add('hide-controls');
            nextBtn.classList.add('hide-controls');
            if (infoBtn) infoBtn.classList.add('hide-controls');
            qualityTag.classList.add('hide-controls');
        });

        // Keyboard Intercept Controls
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                if (player.paused()) player.play(); else player.pause();
            }
            // Added quick keyboard hotkey alternative: 'N' steps to next track profile
            if (e.key.toLowerCase() === 'n') {
                const nextIdx = getNextAvailableIndex();
                if (nextIdx !== -1) playEpisodeIndex(nextIdx);
            }
            if (e.key.toLowerCase() === 'i') {
                const isOpen = playerInfoDrawer && playerInfoDrawer.classList.contains('show');
                if (isOpen) closePlayerInfoDrawer();
                else openPlayerInfoDrawer();
            }
            if (e.key === 'Escape') {
                closePlayerInfoDrawer();
            }
        });

        player.ready(() => {
            initPlayerInfoDrawer();
            loadPlayerDetails();
            initializePremiumStream();
        });
    </script>
    <script src="/js/api-failover.js"></script>
</body>
</html>
