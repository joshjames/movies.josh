<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnyMovie Mobile Demo</title>
    <style>
        :root {
            --frame: #1e1e24;
            --screen: #04070f;
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            background: transparent;
        }

        body {
            display: grid;
            place-items: center;
            padding: 20px;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .phone-wrapper {
            position: relative;
            width: min(320px, 92vw);
            aspect-ratio: 280 / 580;
            background: var(--frame);
            border-radius: 40px;
            padding: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), inset 0 0 2px rgba(255, 255, 255, 0.2);
            border: 1px solid #333;
        }

        .phone-wrapper::before {
            content: '';
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 18px;
            background: #0d1117;
            border-radius: 20px;
            z-index: 10;
        }

        .phone-screen {
            width: 100%;
            height: 100%;
            border-radius: 30px;
            overflow: hidden;
            background: var(--screen);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            background: #000;
        }
    </style>
</head>
<body>
    <div class="phone-wrapper">
        <div class="phone-screen">
            <video autoplay muted loop playsinline controls poster="/images/icons/anymovie_icon_256.png">
                <source src="/media/demo.mp4" type="video/mp4">
            </video>
        </div>
    </div>
</body>
</html>
