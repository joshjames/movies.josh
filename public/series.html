<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Series Navigator</title>
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; }
        .back-link { color: #3b82f6; text-decoration: none; display: inline-block; margin-bottom: 20px; font-weight: 500; }
        .layout-deck { display: flex; flex-direction: column; gap: 30px; }
        .show-sidebar { text-align: center; }
        .poster-frame { width: 100%; max-width: 260px; aspect-ratio: 2/3; background: #020617; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5); margin: 0 auto 16px auto; }
        .poster-frame img { width: 100%; height: 100%; object-fit: cover; }
        h1 { margin: 0 0 8px 0; font-size: 1.8rem; color: #f1f5f9; }
        .show-meta { color: #94a3b8; font-size: 0.9rem; margin-bottom: 12px; }
        .show-plot { color: #cbd5e1; font-size: 0.95rem; line-height: 1.5; }
        .content-browser { flex-grow: 1; background: #1e293b; padding: 24px; border-radius: 12px; border: 1px solid #334155; }
        .selector-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 16px; margin-bottom: 16px; }
        select { background: #0f172a; color: white; border: 1px solid #475569; padding: 10px 16px; border-radius: 6px; font-size: 0.95rem; outline: none; cursor: pointer; }
        .episode-list { display: flex; flex-direction: column; gap: 8px; }
        .episode-row { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; }
        .ep-info { display: flex; flex-direction: column; gap: 4px; }
        .ep-title { font-weight: bold; color: #f1f5f9; font-size: 0.95rem; }
        .ep-meta { color: #64748b; font-size: 0.8rem; word-break: break-all; }
        .play-btn { background: #2563eb; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.85rem; text-decoration: none; }
        .play-btn:hover { background: #1d4ed8; }

        .episode-manager-overlay {
            position: fixed;
            inset: 0;
            background: rgba(2, 6, 23, 0.72);
            display: none;
            z-index: 2000;
            align-items: stretch;
            justify-content: flex-end;
        }
        .episode-manager-overlay.show { display: flex; }
        .episode-manager-drawer {
            width: min(96vw, 920px);
            height: 100vh;
            background: #0b1220;
            border-left: 1px solid #334155;
            display: grid;
            grid-template-rows: auto auto 1fr auto;
        }
        .episode-manager-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            border-bottom: 1px solid #1e293b;
        }
        .episode-manager-toolbar {
            display: flex;
            gap: 8px;
            padding: 10px 18px;
            border-bottom: 1px solid #1e293b;
            align-items: center;
        }
        .episode-manager-table-wrap {
            overflow: auto;
            padding: 12px 18px;
        }
        .episode-manager-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 820px;
            background: #020617;
            border: 1px solid #334155;
        }
        .episode-manager-table th,
        .episode-manager-table td {
            border-bottom: 1px solid #1e293b;
            padding: 8px;
            text-align: left;
            vertical-align: top;
            font-size: 0.8rem;
            color: #cbd5e1;
        }
        .episode-manager-table th {
            position: sticky;
            top: 0;
            background: #111b2f;
            color: #93c5fd;
            z-index: 1;
        }
        .episode-manager-table input,
        .episode-manager-table select {
            width: 100%;
            min-height: 32px;
            background: #0f172a;
            color: #e2e8f0;
            border: 1px solid #334155;
            border-radius: 4px;
            padding: 6px;
            box-sizing: border-box;
        }
        .episode-manager-meta {
            font-family: monospace;
            font-size: 0.72rem;
            color: #94a3b8;
            white-space: pre-wrap;
        }
        .episode-manager-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            border-top: 1px solid #1e293b;
            padding: 12px 18px;
        }
        .epmgr-status { color: #cbd5e1; font-size: 0.8rem; }

        @media(min-width: 768px) {
            .layout-deck { flex-direction: row; align-items: flex-start; }
            .show-sidebar { width: 280px; text-align: left; flex-shrink: 0; }
            h1 { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="/" class="back-link">← Back to Library</a>

        <div class="layout-deck">
            <div class="show-sidebar">
                <div class="poster-frame">
                    <img id="show-poster" src="" alt="Show Poster" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'200\' height=\'300\' viewBox=\'0 0 200 300\'><rect width=\'100%\' height=\'100%\' fill=\'%23020617\'/><text x=\'50%\' y=\'50%\' dominant-baseline=\'middle\' text-anchor=\'middle\' fill=\'%23475569\' font-family=\'sans-serif\' font-size=\'14\'>No Cover Found</text></svg>';">
                </div>
                <h1 id="show-title">Loading Show...</h1>
                <div class="show-meta" id="show-meta"></div>
                <p class="show-plot" id="show-plot"></p>
            </div>

            <div class="content-browser">
                <div class="selector-row">
                    <h3 style="margin:0; color:#3b82f6;">Episodes</h3>
                    <div style="display:flex; gap:8px; align-items:center;">
                        <button type="button" onclick="openEpisodeManager()" style="background:#0ea5e9;">Episode Manager</button>
                        <select id="season-select" onchange="loadSeasonEpisodes(this.value)">
                        </select>
                    </div>
                </div>

                <div class="episode-list" id="episode-list">
                </div>
            </div>
        </div>
    </div>

    <div id="episode-manager-overlay" class="episode-manager-overlay" onclick="closeEpisodeManager(event)">
        <div class="episode-manager-drawer" onclick="event.stopPropagation()">
            <div class="episode-manager-header">
                <div>
                    <div style="font-size:1rem; font-weight:700; color:#f8fafc;">Episode Manager</div>
                    <div id="episode-manager-subtitle" style="font-size:0.78rem; color:#93c5fd;">Loading...</div>
                </div>
                <button type="button" onclick="closeEpisodeManager()" style="background:#334155;">Close</button>
            </div>
            <div class="episode-manager-toolbar">
                <button type="button" onclick="reloadEpisodeManager()" style="background:#1d4ed8;">Reload</button>
                <button type="button" onclick="saveEpisodeManager()" style="background:#059669;">Save Changes</button>
                <label style="display:flex; align-items:center; gap:6px; font-size:0.78rem; color:#cbd5e1; user-select:none; white-space:nowrap; margin-left:8px;">
                    <input type="checkbox" id="episode-manager-force-reprocess">
                    Force Reprocess (.web.mp4)
                </label>
                <span id="episode-manager-count" style="font-size:0.8rem;color:#94a3b8;">0 episodes</span>
            </div>
            <div class="episode-manager-table-wrap" id="episode-manager-table-wrap"></div>
            <div class="episode-manager-footer">
                <span id="episode-manager-status" class="epmgr-status">Ready.</span>
                <button type="button" onclick="saveEpisodeManager()" style="background:#16a34a;">Save</button>
            </div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const showId = params.get('id'); 
        let serverShowData = null;
        let episodeManagerCache = null;
        let episodeManagerIsAdmin = false;

        async function initPage() {
            if (!showId) {
                alert("Missing tracking resource details.");
                window.location.href = "/";
                return;
            }

            await loadEpisodeManagerAccess();

            try {
                const cleanFolder = showId.replace('series/', '');
                const response = await fetch(`/api/series/${encodeURIComponent(cleanFolder)}`);
                
                if (!response.ok) {
                    throw new Error(`Server returned status track code: ${response.status}`);
                }

                serverShowData = await response.json();

                // Validation Safeguard: Enforce that valid season matrices exist before rendering
                if (!serverShowData || !serverShowData.seasons) {
                    throw new Error("Invalid or unpopulated schema file maps returned from backend.");
                }

                document.getElementById('show-poster').src = serverShowData.poster;
                document.getElementById('show-title').innerText = serverShowData.title;
                document.getElementById('show-meta').innerText = `${serverShowData.year} • ${serverShowData.genre}`;
                document.getElementById('show-plot').innerText = serverShowData.plot || "No description loaded.";

                const seasonsAvailable = Object.keys(serverShowData.seasons).sort((a,b) => a - b);
                const seasonSelect = document.getElementById('season-select');
                
                if (seasonsAvailable.length === 0) {
                    document.getElementById('episode-list').innerHTML = `<div style="color:#64748b;text-align:center;padding:40px;">No processed track files found on disk structures.</div>`;
                    return;
                }

                seasonSelect.innerHTML = seasonsAvailable.map(s => 
                    `<option value="${s}">Season ${s}</option>`
                ).join('');

                loadSeasonEpisodes(seasonsAvailable[0]);
            } catch (err) {
                console.error("Failed executing structural pipeline initialization:", err);
                document.getElementById('show-title').innerText = "Failed Loading Show Metadata.";
                document.getElementById('episode-list').innerHTML = `<div style="color:#ef4444;text-align:center;padding:40px;">Error: ${err.message}. Ensure your library sanitizer has run completely.</div>`;
            }
        }

        function setEpisodeManagerStatus(message, isError = false) {
            const status = document.getElementById('episode-manager-status');
            status.textContent = message;
            status.style.color = isError ? '#f87171' : '#cbd5e1';
        }

        function openEpisodeManager() {
            if (!episodeManagerIsAdmin) {
                alert('Episode Manager is restricted to admin users.');
                return;
            }
            const overlay = document.getElementById('episode-manager-overlay');
            overlay.classList.add('show');
            reloadEpisodeManager();
        }

        function closeEpisodeManager(event) {
            if (event && event.target && event.target.id !== 'episode-manager-overlay') return;
            document.getElementById('episode-manager-overlay').classList.remove('show');
        }

        function managerApiPath() {
            const cleanFolder = showId.replace('series/', '');
            return `/api/series/${encodeURIComponent(cleanFolder)}/episode-manager`;
        }

        async function loadEpisodeManagerAccess() {
            try {
                const res = await fetch('/api/account/profile');
                const data = await res.json();
                const user = data?.user || {};
                const key = String(user?.userKey || user?.displayName || '').toLowerCase();
                const isAdmin = user?.isAdmin === true || key === 'josh' || key.startsWith('josh@');
                episodeManagerIsAdmin = Boolean(isAdmin);

                const btn = document.querySelector('button[onclick="openEpisodeManager()"]');
                if (btn && !episodeManagerIsAdmin) {
                    btn.style.display = 'none';
                }
            } catch (_err) {
                episodeManagerIsAdmin = false;
                const btn = document.querySelector('button[onclick="openEpisodeManager()"]');
                if (btn) btn.style.display = 'none';
            }
        }

        function renderEpisodeManagerTable(payload) {
            const wrap = document.getElementById('episode-manager-table-wrap');
            const count = Array.isArray(payload?.items) ? payload.items.length : 0;
            document.getElementById('episode-manager-count').textContent = `${count} episodes`;
            document.getElementById('episode-manager-subtitle').textContent = `Show: ${payload?.showFolder || 'Unknown'}`;

            if (!count) {
                wrap.innerHTML = '<div style="color:#94a3b8; padding:20px;">No episodes found in manifest.</div>';
                return;
            }

            const rows = payload.items.map((item) => {
                const key = `${item.seasonNumber}:${item.episodeNumber}`;
                const subtitleOptions = ['<option value="">(none)</option>']
                    .concat((item.subtitleCandidates || []).map((candidate) => {
                        const selected = candidate.relativePath === item.subtitleRelativePath ? 'selected' : '';
                        const label = `${candidate.file}${candidate.lang ? ` [${candidate.lang}]` : ''}`;
                        return `<option value="${escapeHtml(candidate.relativePath || '')}" ${selected}>${escapeHtml(label)}</option>`;
                    }))
                    .join('');

                return `
                    <tr data-key="${escapeHtml(key)}" data-season="${item.seasonNumber}" data-episode="${item.episodeNumber}">
                        <td>${item.seasonNumber}</td>
                        <td>${item.episodeNumber}</td>
                        <td>
                            <input type="text" data-field="title" value="${escapeHtml(item.title || '')}">
                        </td>
                        <td>
                            <input type="text" data-field="localRelativePath" value="${escapeHtml(item.localRelativePath || '')}">
                        </td>
                        <td>
                            <select data-field="subtitleRelativePath">${subtitleOptions}</select>
                            <div style="height:6px"></div>
                            <input type="text" data-field="subtitleRelativePathManual" placeholder="or manual subtitle path" value="${escapeHtml(item.subtitleRelativePath || '')}">
                        </td>
                        <td>
                            <div class="episode-manager-meta">${escapeHtml(item.videoFile || '(no local file)')}</div>
                            <div style="height:8px"></div>
                            <div style="display:flex; gap:6px; flex-wrap:wrap;">
                                <button type="button" onclick="probeEpisode(${item.seasonNumber}, ${item.episodeNumber})" style="background:#1d4ed8;">Probe</button>
                                <button type="button" onclick="audioFixEpisode(${item.seasonNumber}, ${item.episodeNumber})" style="background:#b45309;">Force Audio Fix</button>
                                <button type="button" onclick="transcodeEpisodeProfile(${item.seasonNumber}, ${item.episodeNumber}, '1080p')" style="background:#0f766e;">Build 1080 (4K)</button>
                                <button type="button" onclick="transcodeEpisodeProfile(${item.seasonNumber}, ${item.episodeNumber}, '720p')" style="background:#0369a1;">Build 720</button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');

            wrap.innerHTML = `
                <table class="episode-manager-table">
                    <thead>
                        <tr>
                            <th>Season</th>
                            <th>Episode</th>
                            <th>Title</th>
                            <th>Video Path</th>
                            <th>Subtitle</th>
                            <th>Detected File</th>
                        </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>
            `;
        }

        function escapeHtml(value) {
            return String(value || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        async function reloadEpisodeManager() {
            try {
                setEpisodeManagerStatus('Loading episode manager data...');
                const res = await fetch(managerApiPath());
                const data = await res.json();
                if (!res.ok || !data.success) {
                    throw new Error(data.error || `Request failed (${res.status})`);
                }
                episodeManagerCache = data;
                renderEpisodeManagerTable(data);
                setEpisodeManagerStatus(`Loaded ${data.count || 0} episodes.`);
            } catch (err) {
                document.getElementById('episode-manager-table-wrap').innerHTML = `<div style="color:#f87171; padding:20px;">${escapeHtml(err.message)}</div>`;
                setEpisodeManagerStatus(`Load failed: ${err.message}`, true);
            }
        }

        async function probeEpisode(seasonNumber, episodeNumber) {
            try {
                setEpisodeManagerStatus(`Probing S${seasonNumber}E${episodeNumber}...`);
                const url = `${managerApiPath()}/probe?season=${encodeURIComponent(String(seasonNumber))}&episode=${encodeURIComponent(String(episodeNumber))}`;
                const res = await fetch(url);
                const data = await res.json();
                if (!res.ok || !data.success) {
                    throw new Error(data.error || `Probe failed (${res.status})`);
                }

                const audioSummary = Array.isArray(data?.probe?.audioStreams)
                    ? data.probe.audioStreams.map((row) => `${row.codec || 'audio'} ${row.channels || 0}ch ${row.language || 'und'}`).join(' | ')
                    : 'No audio stream data';
                const videoCodec = data?.probe?.videoCodec || data?.videoCodec || 'unknown';
                const videoResolution = data?.probe?.videoResolution || data?.videoResolution || 'unknown';

                alert(`Probe: S${seasonNumber}E${episodeNumber}\nFile: ${data?.probe?.file || 'unknown'}\nVideo: ${videoCodec} ${videoResolution}\nNeeds downmix: ${data?.probe?.requiresDownmix ? 'yes' : 'no'}\nAudio: ${audioSummary}`);
                setEpisodeManagerStatus(`Probe complete for S${seasonNumber}E${episodeNumber}.`);
            } catch (err) {
                setEpisodeManagerStatus(`Probe failed: ${err.message}`, true);
            }
        }

        async function audioFixEpisode(seasonNumber, episodeNumber) {
            try {
                const ok = confirm(`Run audio-only downmix for S${seasonNumber}E${episodeNumber}? This creates/updates a .web.mp4 profile for that episode.`);
                if (!ok) return;

                setEpisodeManagerStatus(`Transcoding audio for S${seasonNumber}E${episodeNumber}...`);
                const res = await fetch(`${managerApiPath()}/audio-fix`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ seasonNumber, episodeNumber })
                });
                const data = await res.json();
                if (!res.ok || !data.success) {
                    throw new Error(data.error || `Audio fix failed (${res.status})`);
                }

                setEpisodeManagerStatus(`Audio fix complete for S${seasonNumber}E${episodeNumber}.`);
                await reloadEpisodeManager();
                await initPage();
            } catch (err) {
                setEpisodeManagerStatus(`Audio fix failed: ${err.message}`, true);
            }
        }

        async function transcodeEpisodeProfile(seasonNumber, episodeNumber, profile) {
            try {
                const cleanProfile = String(profile || '').trim().toLowerCase();
                if (!['1080p', '720p'].includes(cleanProfile)) {
                    throw new Error('Unsupported profile target.');
                }

                const forceReprocess = Boolean(document.getElementById('episode-manager-force-reprocess')?.checked);

                const confirmMessage = cleanProfile === '1080p'
                    ? `Build 1080p web profile for S${seasonNumber}E${episodeNumber}? This is intended for 4K episode sources.${forceReprocess ? ' Force mode is enabled.' : ''}`
                    : `Build 720p profile for S${seasonNumber}E${episodeNumber}?`;
                const ok = confirm(confirmMessage);
                if (!ok) return;

                setEpisodeManagerStatus(`Building ${cleanProfile} profile for S${seasonNumber}E${episodeNumber}...`);
                const res = await fetch(`${managerApiPath()}/transcode-profile`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ seasonNumber, episodeNumber, profile: cleanProfile, forceReprocess })
                });
                const data = await res.json();
                if (!res.ok || !data.success) {
                    throw new Error(data.error || `Profile build failed (${res.status})`);
                }

                setEpisodeManagerStatus(`Built ${cleanProfile} profile for S${seasonNumber}E${episodeNumber}.`);
                await reloadEpisodeManager();
                await initPage();
            } catch (err) {
                setEpisodeManagerStatus(`Profile build failed: ${err.message}`, true);
            }
        }

        function gatherEpisodeManagerUpdates() {
            const rows = Array.from(document.querySelectorAll('#episode-manager-table-wrap tbody tr'));
            return rows.map((row) => {
                const seasonNumber = Number(row.getAttribute('data-season'));
                const episodeNumber = Number(row.getAttribute('data-episode'));
                const title = row.querySelector('[data-field="title"]')?.value || '';
                const localRelativePath = row.querySelector('[data-field="localRelativePath"]')?.value || '';
                const selectedSubtitle = row.querySelector('[data-field="subtitleRelativePath"]')?.value || '';
                const manualSubtitle = row.querySelector('[data-field="subtitleRelativePathManual"]')?.value || '';

                return {
                    seasonNumber,
                    episodeNumber,
                    title,
                    localRelativePath,
                    subtitleRelativePath: manualSubtitle || selectedSubtitle
                };
            });
        }

        async function saveEpisodeManager() {
            try {
                const updates = gatherEpisodeManagerUpdates();
                if (!updates.length) {
                    setEpisodeManagerStatus('No episode rows to save.');
                    return;
                }

                setEpisodeManagerStatus('Saving episode updates...');
                const res = await fetch(managerApiPath(), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ updates })
                });
                const data = await res.json();
                if (!res.ok || !data.success) {
                    throw new Error(data.error || `Save failed (${res.status})`);
                }

                episodeManagerCache = data;
                renderEpisodeManagerTable(data);
                setEpisodeManagerStatus(`Saved ${data.changed || updates.length} episode entries.`);

                await initPage();
            } catch (err) {
                setEpisodeManagerStatus(`Save failed: ${err.message}`, true);
            }
        }

        function loadSeasonEpisodes(seasonNum) {
            const container = document.getElementById('episode-list');
            if (!serverShowData || !serverShowData.seasons) return;

            const targetSeason = serverShowData.seasons[seasonNum];
            const episodes = targetSeason ? targetSeason.episodes : [];

            if (episodes.length === 0) {
                container.innerHTML = `<div style="color:#64748b;text-align:center;padding:40px;">No tracks registered online or locally for this season selection.</div>`;
                return;
            }

            container.innerHTML = episodes.map(ep => {
                if (ep.available) {
                    return `
                        <div class="episode-row" style="border-left: 4px solid #22c55e;">
                            <div class="ep-info">
                                <span class="ep-title">${ep.episodeNumber}. ${ep.title}</span>
                                <span class="ep-meta">Released: ${ep.released} • Rating: ⭐ ${ep.imdbRating}</span>
                            </div>
                            <a class="play-btn" href="player.html?id=${encodeURIComponent(serverShowData.id)}&season=${seasonNum}&episode=${ep.episodeNumber}">
                                Play
                            </a>
                        </div>
                    `;
                } else {
                    return `
                        <div class="episode-row" style="opacity: 0.4; background: #0b0f19; border-left: 4px solid #475569;">
                            <div class="ep-info">
                                <span class="ep-title" style="color: #94a3b8;">${ep.episodeNumber}. ${ep.title} (Missing)</span>
                                <span class="ep-meta">Aired: ${ep.released} | Online Meta Data Sync Available</span>
                            </div>
                            <button class="play-btn" style="background:#334155; cursor:not-allowed;" disabled>
                                Unacquired
                            </button>
                        </div>
                    `;
                }
            }).join('');
        }

        window.onload = initPage;
        window.probeEpisode = probeEpisode;
        window.audioFixEpisode = audioFixEpisode;
    </script>
    <script src="/js/api-failover.js"></script>
</body>
</html>
