<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unified Media Browser</title>
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; margin: 0; padding: 12px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h1 { font-size: 1.5rem; margin: 0; }
        .nav-link { color: #3b82f6; text-decoration: none; font-weight: 500; font-size: 0.9rem; }
        
        /* Navigation Tabs Control */
        .tabs-row { display: flex; gap: 8px; margin-bottom: 16px; border-bottom: 2px solid #1e293b; padding-bottom: 8px; }
        .tab-btn { background: transparent; border: none; color: #94a3b8; padding: 10px 20px; font-weight: 600; cursor: pointer; font-size: 1rem; border-radius: 6px; min-width: auto; }
        .tab-btn.active { background: #1e293b; color: #3b82f6; border-bottom: 2px solid #3b82f6; }

        /* Filter Controls Container */
        .search-bar { background: #1e293b; padding: 16px; border-radius: 12px; display: flex; flex-direction: column; gap: 16px; margin-bottom: 24px; border: 1px solid #334155; }
        .controls-row { display: flex; flex-wrap: wrap; gap: 12px; width: 100%; align-items: center; }
        
        input, select, button { background: #0f172a; color: white; border: 1px solid #475569; padding: 10px 14px; border-radius: 6px; font-size: 0.9rem; outline: none; }
        input { flex-grow: 1; min-width: 200px; }
        button { background: #2563eb; border: none; cursor: pointer; font-weight: bold; min-width: 100px; }
        button:hover { background: #1d4ed8; }

        .checkbox-container { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; color: #cbd5e1; cursor: pointer; white-space: nowrap; user-select: none; }

        .catalogs-toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            border-top: 1px solid #334155;
            border-bottom: 1px solid #334155;
            padding: 10px 2px;
        }

        .catalogs-toggle-btn {
            background: linear-gradient(135deg, #1d4ed8, #2563eb);
            border: 1px solid #3b82f6;
            color: #e2e8f0;
            border-radius: 999px;
            padding: 8px 14px;
            font-size: 0.8rem;
            font-weight: 700;
            min-width: 0;
        }

        .catalogs-toggle-btn:hover {
            background: linear-gradient(135deg, #1e40af, #1d4ed8);
        }

        .catalogs-active-label {
            color: #93c5fd;
            font-size: 0.78rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .catalogs-drawer {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.25s ease;
        }

        .catalogs-drawer.open {
            max-height: 130px;
        }

        .catalogs-grid {
            display: flex;
            overflow-x: auto;
            overflow-y: hidden;
            gap: 10px;
            margin-top: 10px;
            padding: 2px 2px 8px 2px;
            scrollbar-width: thin;
            scrollbar-color: #334155 #0f172a;
        }

        .catalogs-grid::-webkit-scrollbar {
            height: 8px;
        }

        .catalogs-grid::-webkit-scrollbar-track {
            background: #0f172a;
            border-radius: 999px;
        }

        .catalogs-grid::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 999px;
        }

        .catalog-chip {
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid #334155;
            background: #111827;
            color: #e2e8f0;
            border-radius: 10px;
            padding: 10px;
            cursor: pointer;
            min-width: 0;
            min-width: 210px;
            max-width: 260px;
            flex: 0 0 auto;
        }

        .catalog-chip:hover {
            border-color: #3b82f6;
            background: #0f1b31;
        }

        .catalog-chip.active {
            border-color: #2563eb;
            box-shadow: inset 0 0 0 1px rgba(37, 99, 235, 0.35);
            background: #0d1a32;
        }

        .catalog-chip-icon {
            width: 28px;
            height: 28px;
            border-radius: 999px;
            background: #1e293b;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            flex: 0 0 auto;
        }

        .catalog-chip-text {
            min-width: 0;
            display: grid;
            gap: 2px;
        }

        .catalog-chip-title {
            color: #f8fafc;
            font-size: 0.78rem;
            font-weight: 700;
            line-height: 1.2;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .catalog-chip-meta {
            color: #94a3b8;
            font-size: 0.7rem;
        }

        /* Item 7 Manual Link Wrapper Section */
        .manual-input-box { display: flex; gap: 12px; width: 100%; border-top: 1px solid #334155; padding-top: 14px; margin-top: 2px; }
        .manual-input-box input { background: #090d16; border-color: #334155; }
        .manual-btn { background: #10b981; }
        .manual-btn:hover { background: #059669; }

        /* Results Matrix Grid Layout */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; }
        .card { background: #1e293b; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 4px 6px rgba(0,0,0,0.3); position: relative; border: 1px solid #334155; }
        .card.local-card { border-color: #14532d; box-shadow: 0 0 0 1px rgba(22, 101, 52, 0.45), 0 4px 6px rgba(0,0,0,0.25); }
        .card.local-card .cover-frame { outline: 2px solid rgba(22, 163, 74, 0.3); outline-offset: -2px; }
        .section-head { grid-column: 1/-1; display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; border-radius: 8px; background: #111827; border: 1px solid #334155; }
        .section-head strong { font-size: 0.88rem; color: #f8fafc; }
        .section-head span { font-size: 0.76rem; color: #94a3b8; }
        .cover-frame { width: 100%; aspect-ratio: 2/3; background: #020617; position: relative; }
        .cover-frame img { width: 100%; height: 100%; object-fit: cover; }
        
        .badge-row { position: absolute; top: 8px; left: 8px; right: 8px; display: flex; justify-content: space-between; pointer-events: none; }
        .rating-badge, .seeds-badge, .size-badge { background: rgba(15, 23, 42, 0.85); padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; backdrop-filter: blur(4px); }
        .rating-badge { color: #f59e0b; }
        .seeds-badge { color: #22c55e; }
        .size-badge { color: #38bdf8; }

        .card-info { padding: 12px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; gap: 10px; }
        .title { font-size: 0.85rem; font-weight: bold; line-height: 1.3; display: -webkit-box; line-clamp: 2; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: #f8fafc; }
        .meta { font-size: 0.75rem; color: #94a3b8; margin-top: 2px; }
        
        .add-btn { background: #10b981; border: none; width: 100%; padding: 8px; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; font-size: 0.85rem; transition: background 0.2s; }
        .add-btn:hover { background: #059669; }
        .open-btn { background: #2563eb; border: none; width: 100%; padding: 8px; border-radius: 6px; color: white; text-decoration: none; font-weight: bold; cursor: pointer; font-size: 0.85rem; text-align: center; }
        .open-btn:hover { background: #1d4ed8; }
        .add-btn.in-library { background: #475569; cursor: not-allowed; }

        /* Notification Toast Styling */
        .toast { position: fixed; bottom: 20px; right: 20px; background: #059669; color: white; padding: 16px 24px; border-radius: 8px; font-weight: 500; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5); display: none; z-index: 1000; animation: slideIn 0.2s ease-out; }
        @keyframes slideIn { from { transform: translateY(100px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        @media(min-width: 640px) { h1 { font-size: 2rem; } .grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; } }
        
        /* Pagination Control Bar Styling */
        .pagination-container { display: flex; justify-content: center; align-items: center; gap: 12px; margin-top: 40px; margin-bottom: 24px; padding: 16px; background: #1e293b; border-radius: 12px; border: 1px solid #334155; }
        .page-btn { background: #0f172a; color: #f8fafc; border: 1px solid #475569; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 500; transition: all 0.2s ease; }
        .page-btn:hover:not(:disabled) { background: #2563eb; border-color: #3b82f6; }
        .page-btn:disabled { opacity: 0.4; cursor: not-allowed; border-color: #334155; }
        .page-indicator { font-size: 0.9rem; color: #94a3b8; font-weight: 500; min-width: 100px; text-align: center; }

        .season-panel { grid-column: 1 / -1; background: #111b30; border: 1px solid #334155; border-radius: 10px; overflow: hidden; }
        .season-panel + .season-panel { margin-top: 10px; }
        .season-summary { cursor: pointer; list-style: none; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; background: #17233a; color: #cbd5e1; }
        .season-summary::-webkit-details-marker { display: none; }
        .season-summary strong { color: #f8fafc; }
        .episode-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
        .episode-table th, .episode-table td { border-top: 1px solid #263247; padding: 8px 10px; text-align: left; vertical-align: top; }
        .episode-table th { color: #94a3b8; font-weight: 600; background: #0f1b31; }
        .episode-table td { color: #cbd5e1; }
        .episode-table .ep-title { color: #f8fafc; font-weight: 600; }
        .episode-table .ep-meta { color: #94a3b8; font-size: 0.72rem; margin-top: 2px; }
        .episode-add { white-space: nowrap; }
        .show-overview { grid-column: 1 / -1; display: grid; grid-template-columns: 92px 1fr; gap: 12px; background: #111b30; border: 1px solid #334155; border-radius: 10px; padding: 10px; }
        .show-overview img { width: 92px; height: 138px; object-fit: cover; border-radius: 8px; background: #020617; }
        .show-overview-meta { min-width: 0; }
        .show-overview-meta h2 { margin: 0 0 5px; font-size: 1.05rem; color: #f8fafc; }
        .show-overview-meta .line { font-size: 0.82rem; color: #94a3b8; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-nav">
            <h1>Browse Catalog</h1>
            <a href="/" class="nav-link">← Return to Library</a>
        </div>

        <div class="tabs-row">
            <button class="tab-btn active" id="tab-movies" onclick="switchMode('movies')">Movies</button>
            <button class="tab-btn" id="tab-shows" onclick="switchMode('shows')">TV Series</button>
        </div>

        <div class="search-bar">
            <div class="controls-row">
                <input type="search" id="searchIn" placeholder="Search title, actor, or genre...">
                <button type="button" id="searchBtn" onclick="triggerNewSearch()">Search</button>
                
                <select id="genreIn">
                    <option value="All">All Genres</option>
                    <option value="action">Action</option>
                    <option value="adventure">Adventure</option>
                    <option value="animation">Animation</option>
                    <option value="biography">Biography</option>
                    <option value="comedy">Comedy</option>
                    <option value="crime">Crime</option>
                    <option value="documentary">Documentary</option>
                    <option value="drama">Drama</option>
                    <option value="family">Family</option>
                    <option value="fantasy">Fantasy</option>
                    <option value="film-noir">Film-Noir</option>
                    <option value="history">History</option>
                    <option value="horror">Horror</option>
                    <option value="music">Music</option>
                    <option value="musical">Musical</option>
                    <option value="mystery">Mystery</option>
                    <option value="romance">Romance</option>
                    <option value="sci-fi">Sci-Fi</option>
                    <option value="sport">Sport</option>
                    <option value="thriller">Thriller</option>
                    <option value="war">War</option>
                    <option value="western">Western</option>
                </select>
                <select id="ratingIn">
                    <option value="0">Any Rating</option>
                    <option value="6">⭐ 6.0+ IMDb</option>
                    <option value="7">⭐ 7.0+ IMDb</option>
                    <option value="8">⭐ 8.0+ IMDb</option>
                </select>
                <select id="sortIn">
                    <option value="date_added">Sort: Latest Added</option> 
                    <option value="seeds">Sort: Most Seeds</option>
                    <option value="year">Sort: Release Year</option>
                    <option value="rating">Sort: IMDb Score</option>
                </select>

                <select id="tvCatalogIn" style="display:none;">
                    <option value="">TV Catalog: Trending</option>
                </select>

                <label class="checkbox-container" id="packsWrapper" style="display: none;">
                    <input type="checkbox" id="packsOnlyIn"> Show Whole Seasons Only
                </label>
            </div>

            <div class="catalogs-toggle-row" id="catalogs-toggle-row">
                <button type="button" class="catalogs-toggle-btn" id="catalogs-toggle-btn" onclick="toggleCatalogDrawer()">Catalogs ▾</button>
                <div class="catalogs-active-label" id="catalogs-active-label">Pick a catalog to load curated movies.</div>
            </div>

            <div class="catalogs-drawer" id="catalogs-drawer">
                <div id="catalogs-grid" class="catalogs-grid">
                    <div style="grid-column:1/-1; color:#94a3b8; font-size:0.82rem; padding:8px;">Loading catalogs...</div>
                </div>
            </div>

            <div class="manual-input-box">
                <input type="text" id="manualMagnetIn" placeholder="Paste direct magnet link...">
                <button class="manual-btn" onclick="addManualMagnet(this)">Ingest Link</button>
            </div>
        </div>

        <div id="catalog-grid" class="grid"></div>
        <div id="pagination-wrapper"></div>
        <div id="toastNotice" class="toast"></div>
    </div>

    <script>
        let currentMode = 'movies';
        let currentBrowsePage = 1;
        let currentCatalogPage = 1;
        let activeCatalogSlug = '';
        let activeCatalogTitle = '';
        let catalogDrawerOpen = false;
        let availableCatalogs = [];
        let availableTvCatalogs = [];
        let activeTvCatalogSlug = '';
        let tvSearchTimer = null;
        const tvCoverByImdb = Object.create(null);
        const NO_COVER_DATA_URI = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="300"><rect width="100%" height="100%" fill="%23020617"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="%23475569">No Cover</text></svg>';

        function handleImageFallback(img) {
            if (!img) return;
            img.onerror = null;
            img.src = NO_COVER_DATA_URI;
        }

        function normalizeSearchText(value = '') {
            return String(value || '')
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();
        }

        function setCatalogActiveLabel(text) {
            const el = document.getElementById('catalogs-active-label');
            if (!el) return;
            el.textContent = text;
        }

        function setCatalogDrawerOpen(open) {
            catalogDrawerOpen = Boolean(open);
            const drawer = document.getElementById('catalogs-drawer');
            const toggle = document.getElementById('catalogs-toggle-btn');
            if (drawer) drawer.classList.toggle('open', catalogDrawerOpen);
            if (toggle) toggle.textContent = catalogDrawerOpen ? 'Catalogs ▴' : 'Catalogs ▾';
        }

        function toggleCatalogDrawer() {
            if (currentMode !== 'movies') return;
            setCatalogDrawerOpen(!catalogDrawerOpen);
        }

        function clearActiveCatalogMode() {
            activeCatalogSlug = '';
            activeCatalogTitle = '';
            currentCatalogPage = 1;
            setCatalogActiveLabel('Pick a catalog to load curated movies.');
            renderCatalogChips();
        }

        function renderCatalogChips() {
            const grid = document.getElementById('catalogs-grid');
            if (!grid) return;

            if (!availableCatalogs.length) {
                grid.innerHTML = '<div style="grid-column:1/-1; color:#94a3b8; font-size:0.82rem; padding:8px;">No catalog files discovered.</div>';
                return;
            }

            grid.innerHTML = availableCatalogs.map((catalog) => {
                const activeClass = catalog.slug === activeCatalogSlug ? ' active' : '';
                return `
                    <button type="button" class="catalog-chip${activeClass}" onclick="openCatalog('${catalog.slug}', '${encodeURIComponent(catalog.title)}')">
                        <span class="catalog-chip-icon">${catalog.icon || '📚'}</span>
                        <span class="catalog-chip-text">
                            <span class="catalog-chip-title">${escapeHtml(catalog.title || catalog.slug)}</span>
                            <span class="catalog-chip-meta">${Number(catalog.count || 0).toLocaleString()} titles</span>
                        </span>
                    </button>
                `;
            }).join('');
        }

        async function loadCatalogList() {
            const grid = document.getElementById('catalogs-grid');
            if (!grid) return;

            try {
                const res = await fetch('/api/catalogs/movies');
                const data = await parseJsonOrThrow(res);
                availableCatalogs = Array.isArray(data.catalogs) ? data.catalogs : [];
                renderCatalogChips();
            } catch (_err) {
                grid.innerHTML = '<div style="grid-column:1/-1; color:#f97316; font-size:0.82rem; padding:8px;">Catalog list failed to load.</div>';
            }
        }

        function renderTvCatalogOptions() {
            const select = document.getElementById('tvCatalogIn');
            if (!select) return;

            if (!availableTvCatalogs.length) {
                select.innerHTML = '<option value="">TV Catalog: Trending</option>';
                return;
            }

            select.innerHTML = availableTvCatalogs.map((catalog) => {
                const selected = catalog.slug === activeTvCatalogSlug ? ' selected' : '';
                return `<option value="${catalog.slug}"${selected}>TV Catalog: ${escapeHtml(catalog.title || catalog.slug)} (${Number(catalog.count || 0).toLocaleString()})</option>`;
            }).join('');
        }

        async function loadTvCatalogList() {
            const select = document.getElementById('tvCatalogIn');
            if (!select) return;

            try {
                const res = await fetch('/api/catalogs/tv');
                const data = await parseJsonOrThrow(res);
                availableTvCatalogs = Array.isArray(data.catalogs) ? data.catalogs : [];
                activeTvCatalogSlug = String(data.defaultSlug || '').trim() || (availableTvCatalogs[0]?.slug || '');
                renderTvCatalogOptions();
            } catch (_err) {
                availableTvCatalogs = [];
                activeTvCatalogSlug = '';
                renderTvCatalogOptions();
            }
        }

        function renderCatalogResultCards(items) {
            return (items || []).map((item) => {
                const encodedTitle = encodeURIComponent(String(item.title || ''));
                const localCover = item.localCover || (item.localId ? `/movie-assets/${encodeURIComponent(item.localId)}/cover.jpg` : '');
                const cachedCover = item.cover || '';
                const remoteCover = item.imdbId ? `/api/catalogs/movies/cover/${encodeURIComponent(item.imdbId)}` : '';
                const primaryCover = item.inLibrary && localCover
                    ? localCover
                    : (cachedCover || remoteCover);
                const watchAction = item.inLibrary && item.localHref
                    ? `<a class="open-btn" href="${item.localHref}">Watch Now</a>`
                    : `<button class="add-btn" onclick="queueCatalogItem(this, '${item.imdbId || ''}', '${encodedTitle}', '${item.year || ''}')">Find & Queue</button>`;

                return `
                    <div class="card ${item.inLibrary ? 'local-card' : ''}">
                        <div class="cover-frame">
                            <img src="${sanitizeImageSrc(primaryCover)}" alt="${escapeHtml(item.title || 'Movie')}" data-local-cover="${sanitizeImageSrc(localCover)}" data-cached-cover="${sanitizeImageSrc(cachedCover)}" data-remote-cover="${sanitizeImageSrc(remoteCover)}" onerror="handleCatalogCardImageError(this)">
                            <div class="badge-row">
                                <span class="rating-badge">⭐ ${Number(item.rating || 0).toFixed(1)}</span>
                                ${item.inLibrary ? '<span class="size-badge">In Library</span>' : ''}
                            </div>
                        </div>
                        <div class="card-info">
                            <div>
                                <div class="title">${escapeHtml(item.title || 'Unknown')}</div>
                                <div class="meta">${escapeHtml(String(item.year || ''))}${Array.isArray(item.genres) && item.genres.length ? ` • ${escapeHtml(item.genres.slice(0, 2).join(', '))}` : ''}</div>
                                <div class="meta">${Number(item.votes || 0).toLocaleString()} votes ${item.imdbId ? `• ${escapeHtml(item.imdbId)}` : ''}</div>
                            </div>
                            ${watchAction}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function handleCatalogCardImageError(img) {
            const tried = new Set(String(img.dataset.tried || '').split(',').filter(Boolean));
            const candidates = [
                String(img.dataset.localCover || '').trim(),
                String(img.dataset.cachedCover || '').trim(),
                String(img.dataset.remoteCover || '').trim()
            ].filter(Boolean);

            for (const candidate of candidates) {
                if (tried.has(candidate) || img.src.endsWith(candidate)) continue;
                tried.add(candidate);
                img.dataset.tried = Array.from(tried).join(',');
                img.src = candidate;
                return;
            }

            handleImageFallback(img);
        }

        async function fetchCatalogPage(page = 1) {
            if (!activeCatalogSlug) return;

            currentCatalogPage = page;
            const grid = document.getElementById('catalog-grid');
            const paginationWrapper = document.getElementById('pagination-wrapper');
            if (!grid || !paginationWrapper) return;

            grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:40px; color:#94a3b8;">Loading selected catalog...</div>';
            paginationWrapper.innerHTML = '';

            try {
                const res = await fetch(`/api/catalogs/movies/${encodeURIComponent(activeCatalogSlug)}?page=${currentCatalogPage}&limit=24`);
                const data = await parseJsonOrThrow(res);
                const items = Array.isArray(data.items) ? data.items : [];

                if (!items.length) {
                    grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:40px; color:#94a3b8;">This catalog has no entries.</div>';
                    return;
                }

                const inLibraryCount = items.filter(item => item.inLibrary).length;
                grid.innerHTML = `
                    <div class="section-head">
                        <strong>${escapeHtml(data.title || activeCatalogTitle || 'Catalog')}</strong>
                        <span>${items.length} shown • ${inLibraryCount} already in library</span>
                    </div>
                    ${renderCatalogResultCards(items)}
                `;

                renderCatalogPaginationControls(data.total || 0, data.limit || 24);
            } catch (_err) {
                grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:40px; color:#f43f5e;">Unable to load this catalog.</div>';
            }
        }

        function renderCatalogPaginationControls(totalItems, pageLimit) {
            const paginationWrapper = document.getElementById('pagination-wrapper');
            if (!paginationWrapper || !totalItems || !pageLimit) return;

            const totalPages = Math.ceil(totalItems / pageLimit);
            if (totalPages <= 1) {
                paginationWrapper.innerHTML = '';
                return;
            }

            paginationWrapper.innerHTML = `
                <div class="pagination-container">
                    <button class="page-btn" ${currentCatalogPage === 1 ? 'disabled' : ''} onclick="fetchCatalogPage(${currentCatalogPage - 1})">◀ Previous</button>
                    <div class="page-indicator">Page ${currentCatalogPage} / ${totalPages}</div>
                    <button class="page-btn" ${currentCatalogPage === totalPages ? 'disabled' : ''} onclick="fetchCatalogPage(${currentCatalogPage + 1})">Next ▶</button>
                </div>
            `;
        }

        async function queueCatalogItem(button, imdbId, encodedTitle, year) {
            const title = decodeURIComponent(String(encodedTitle || ''));
            const cleanYear = String(year || '').trim();
            const cleanImdb = String(imdbId || '').trim().toLowerCase();

            button.disabled = true;
            button.textContent = 'Finding Source...';
            button.style.background = '#475569';

            try {
                const res = await fetch(`/api/movies/search/unified?q=${encodeURIComponent(title)}&remoteMode=always&remoteLimit=24&localLimit=0`);
                const data = await parseJsonOrThrow(res);
                const remote = Array.isArray(data.remoteResults) ? data.remoteResults : [];

                if (!remote.length) {
                    throw new Error('No remote matches found.');
                }

                const normalizedTitle = normalizeSearchText(title);
                const selected = remote.find(row => String(row.imdbId || '').toLowerCase() === cleanImdb)
                    || remote.find(row => normalizeSearchText(row.title || '') === normalizedTitle && String(row.year || '') === cleanYear)
                    || remote.find(row => normalizeSearchText(row.title || '') === normalizedTitle)
                    || remote[0];

                const magnet = buildMovieMagnet(selected);
                if (!magnet) {
                    throw new Error('Matching release has no torrent payload.');
                }

                await addMediaAsset(button, btoa(magnet), 'movie-streamer', selected.imdbId || cleanImdb);
            } catch (_err) {
                button.disabled = false;
                button.textContent = 'Find & Queue';
                button.style.background = '#10b981';
                showToast('Could not queue this title from current remote index.');
            }
        }

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('tab-movies').classList.toggle('active', mode === 'movies');
            document.getElementById('tab-shows').classList.toggle('active', mode === 'shows');

            const isMovie = mode === 'movies';
            document.getElementById('genreIn').style.display = isMovie ? 'inline-block' : 'none';
            document.getElementById('ratingIn').style.display = isMovie ? 'inline-block' : 'none';
            document.getElementById('sortIn').style.display = isMovie ? 'inline-block' : 'none';
            document.getElementById('tvCatalogIn').style.display = isMovie ? 'none' : 'inline-block';
            document.getElementById('packsWrapper').style.display = isMovie ? 'none' : 'flex';
            document.getElementById('catalogs-toggle-row').style.display = isMovie ? 'flex' : 'none';
            document.getElementById('catalogs-drawer').style.display = isMovie ? 'block' : 'none';

            document.getElementById('searchIn').placeholder = isMovie
                ? 'Search title, actor, or genre...'
                : 'Search TV series from local IMDb index...';

            if (!isMovie) {

                document.getElementById('searchIn').value = '';
                setCatalogDrawerOpen(false);
            } else {
                setCatalogDrawerOpen(catalogDrawerOpen);

            if (currentMode === 'movies') {
                clearActiveCatalogMode();
                fetchMovieCatalog(1);
            } else {
                fetchShowCatalog();
            }
        }

        function openCatalog(slug, encodedTitle) {
            activeCatalogSlug = String(slug || '').trim();
            activeCatalogTitle = decodeURIComponent(String(encodedTitle || ''));
            if (!activeCatalogSlug) return;

            setCatalogActiveLabel(`Selected: ${activeCatalogTitle}`);
            renderCatalogChips();
            setCatalogDrawerOpen(false);
            fetchCatalogPage(1);

        document.getElementById('genreIn').addEventListener('change', triggerNewSearch);
        document.getElementById('ratingIn').addEventListener('change', triggerNewSearch);
        document.getElementById('sortIn').addEventListener('change', triggerNewSearch);
        document.getElementById('tvCatalogIn').addEventListener('change', () => {
            activeTvCatalogSlug = String(document.getElementById('tvCatalogIn').value || '').trim();
            if (currentMode === 'shows' && !document.getElementById('searchIn').value.trim()) {
                fetchShowCatalog();
            }
        });
        document.getElementById('packsOnlyIn').addEventListener('change', () => {
            if (currentMode === 'shows') {
                fetchShowCatalog();
            }
        });
        document.getElementById('searchIn').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') triggerNewSearch();
        });
        document.getElementById('searchIn').addEventListener('input', () => {
            if (currentMode !== 'shows') return;
            if (tvSearchTimer) clearTimeout(tvSearchTimer);
            tvSearchTimer = setTimeout(() => {
                fetchShowCatalog();
            }, 220);
        });

        async function parseJsonOrThrow(response) {
            const raw = await response.text();
            let parsed;
            try {
                parsed = raw ? JSON.parse(raw) : {};
            } catch (_err) {
                throw new Error(`HTTP ${response.status}: non-JSON response`);
            }

            if (!response.ok) {
                const msg = parsed && parsed.error ? parsed.error : `HTTP ${response.status}`;
                throw new Error(msg);
            }

            return parsed;
        }

        function renderTvCards(items) {
            return items.map(show => {
                const yearLabel = show.endYear && show.endYear !== '\\N'
                    ? `${show.startYear || '?'}-${show.endYear}`
                    : (show.startYear || 'Year unknown');
                const votes = Number(show.numVotes || 0).toLocaleString();
                const rating = Number(show.averageRating || 0).toFixed(1);
                const safeTitle = String(show.title || '').replace(/'/g, "\\'");
                tvCoverByImdb[String(show.imdbId || '')] = show.cover || '';

                return `
                    <div class="card">
                        <div class="cover-frame">
                            <img src="${show.cover}" onerror="handleImageFallback(this)">
                            <div class="badge-row">
                                <span class="rating-badge">⭐ ${rating}</span>
                                <span class="size-badge">${votes} votes</span>
                            </div>
                        </div>
                        <div class="card-info">
                            <div>
                                <div class="title" title="${show.title}">${show.title}</div>
                                <div class="meta">${yearLabel} • ${show.genres || 'Unknown genres'}</div>
                            </div>
                            <button class="add-btn" style="background:#10b981;" onclick="loadShowTorrents('${show.imdbId}', '${safeTitle}')">Browse Episodes</button>
                        </div>

                `;
            }).join('');
        }

        function sanitizeImageSrc(value) {
            return String(value || '').replace(/"/g, '%22').replace(/\s/g, '%20');
        }

        function buildMovieMagnet(movie) {
            const torrents = Array.isArray(movie.torrents) ? movie.torrents : [];
            const targetTorrent = torrents.find(t => t.quality === '1080p') || torrents[0];
            if (!targetTorrent || !targetTorrent.hash) return null;

            const trackers = [
                'udp://tracker.opentrackr.org:1337/announce',
                'udp://tracker.torrent.eu.org:451/announce',
                'udp://open.stealth.si:80/announce'
            ].map(tr => `&tr=${encodeURIComponent(tr)}`).join('');

            const cleanHash = String(targetTorrent.hash).toUpperCase().trim();
            return `magnet:?xt=urn:btih:${cleanHash}&dn=${encodeURIComponent(movie.title || 'movie')}${trackers}`;
        }

        function renderLocalMovieCards(localRows) {
            if (!Array.isArray(localRows) || localRows.length === 0) return '';

            return localRows.map(movie => `
                <div class="card local-card">
                    <div class="cover-frame">
                        <img src="${sanitizeImageSrc(movie.cover || '')}" alt="${escapeHtml(movie.title || 'Local Movie')}" onerror="handleImageFallback(this)">
                        <div class="badge-row">
                            <span class="size-badge">In Library</span>
                        </div>
                    </div>
                    <div class="card-info">
                        <div>
                            <div class="title">${escapeHtml(movie.title || 'Unknown')}</div>
                            <div class="meta">${escapeHtml(movie.year || 'Year unknown')} ${movie.imdbId ? `• ${escapeHtml(movie.imdbId)}` : ''}</div>
                        </div>
                        <a class="open-btn" href="${movie.href}">Play Now</a>
                    </div>
                </div>
            `).join('');
        }

        function renderRemoteMovieCards(remoteRows) {
            if (!Array.isArray(remoteRows) || remoteRows.length === 0) return '';

            return remoteRows.map(movie => {
                const magnet = buildMovieMagnet(movie);
                const disabledClass = movie.inLibrary ? ' in-library' : '';
                const btnText = movie.inLibrary ? 'Already in Library' : 'Add to Library';
                const onclick = (movie.inLibrary || !magnet)
                    ? ''
                    : `onclick="addMediaAsset(this, '${btoa(magnet)}', 'movie-streamer', '${movie.imdbId || ''}')"`;

                return `
                    <div class="card">
                        <div class="cover-frame">
                            <img src="${sanitizeImageSrc(movie.cover || '')}" alt="${escapeHtml(movie.title || 'Movie')}" onerror="handleImageFallback(this)">
                            <div class="badge-row">
                                <span class="rating-badge">⭐ ${Number(movie.imdbRating || 0).toFixed(1)}</span>
                                ${movie.inLibrary ? '<span class="size-badge">Have It</span>' : ''}
                            </div>
                        </div>
                        <div class="card-info">
                            <div>
                                <div class="title">${escapeHtml(movie.title || 'Unknown')}</div>
                                <div class="meta">${escapeHtml(String(movie.year || ''))} ${movie.runtime ? `• ${escapeHtml(String(movie.runtime))} min` : ''}</div>
                            </div>
                            <button class="add-btn${disabledClass}" ${onclick} ${movie.inLibrary || !magnet ? 'disabled' : ''}>${btnText}</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function escapeHtml(value) {
            return String(value || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function chooseBestEpisodeRows(rows) {
            const packRows = [];
            const byEpisode = new Map();

            for (const row of (rows || [])) {
                const sourceType = String(row.sourceType || '').toLowerCase();
                const season = parseInt(row.season, 10);
                const episode = parseInt(row.episode, 10);
                const seeds = parseInt(row.seeds, 10) || 0;
                const peers = parseInt(row.peers, 10) || 0;
                const score = seeds * 1000 + peers;

                if (sourceType === 'pack') {
                    packRows.push(row);
                    continue;
                }
                if (!Number.isFinite(season) || season <= 0 || !Number.isFinite(episode) || episode <= 0) {
                    continue;
                }

                const key = `${season}-${episode}`;
                const existing = byEpisode.get(key);
                if (!existing || score > existing.score) {
                    byEpisode.set(key, { row, score, season, episode });
                }
            }

            const episodes = Array.from(byEpisode.values())
                .sort((a, b) => {
                    if (a.season !== b.season) return a.season - b.season;
                    return a.episode - b.episode;
                })
                .map(x => x.row);

            return { episodes, packs: packRows };
        }

        function renderEpisodeTableRows(rows) {
            return rows.map(row => {
                const season = String(parseInt(row.season, 10)).padStart(2, '0');
                const episode = String(parseInt(row.episode, 10)).padStart(2, '0');
                return `
                    <tr>
                        <td>
                            <div class="ep-title">S${season}E${episode}</div>
                            <div class="ep-meta">${escapeHtml(row.originalTitle || row.title || '')}</div>
                        </td>
                        <td>${escapeHtml(row.size || 'N/A')}</td>
                        <td>▲ ${parseInt(row.seeds, 10) || 0}</td>
                        <td class="episode-add"><button class="add-btn" style="padding:6px 10px;" onclick="addMediaAsset(this, '${btoa(row.magnet)}', 'series-streamer', '${row.imdbId || ''}', ${parseInt(row.season, 10) || 0}, ${parseInt(row.episode, 10) || 0}, 'episode')">Ingest Episode</button></td>
                    </tr>
                `;
            }).join('');
        }

        function renderPackRows(rows) {
            if (!rows.length) return '';
            return `
                <div class="season-panel">
                    <div class="season-summary"><strong>Season Packs</strong><span>${rows.length} rows</span></div>
                    <table class="episode-table">
                        <thead>
                            <tr><th>Release</th><th>Size</th><th>Seeds</th><th>Action</th></tr>
                        </thead>
                        <tbody>
                            ${rows.map(row => `
                                <tr>
                                    <td>
                                        <div class="ep-title">${escapeHtml(row.title || '')}</div>
                                        <div class="ep-meta">${escapeHtml(row.originalTitle || '')}</div>
                                    </td>
                                    <td>${escapeHtml(row.size || 'N/A')}</td>
                                    <td>▲ ${parseInt(row.seeds, 10) || 0}</td>
                                    <td class="episode-add"><button class="add-btn" style="padding:6px 10px;" onclick="addMediaAsset(this, '${btoa(row.magnet)}', 'series-streamer', '${row.imdbId || ''}', ${parseInt(row.season, 10) || 0}, 0, 'pack')">Ingest Season</button></td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        async function fetchMovieCatalog(page = 1) {
            currentBrowsePage = page;
            if (activeCatalogSlug) return;
            const query = document.getElementById('searchIn').value.trim();
            const genre = document.getElementById('genreIn').value;
            const rating = document.getElementById('ratingIn').value;
            const sortBy = document.getElementById('sortIn').value;
            const grid = document.getElementById('catalog-grid');
            const paginationWrapper = document.getElementById('pagination-wrapper');

            if (!grid || !paginationWrapper) return;

            grid.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding:40px; color:#94a3b8;">Querying movie index structures...</div>';
            paginationWrapper.innerHTML = '';

            try {
                let apiTarget = `/api/movies/search/unified?page=${currentBrowsePage}&remoteMode=always&remoteLimit=24&localLimit=8`;
                if (query) apiTarget += `&q=${encodeURIComponent(query)}`;
                if (genre && genre !== 'All') apiTarget += `&genre=${genre}`;
                if (rating && rating !== '0') apiTarget += `&minimum_rating=${rating}`;
                if (sortBy) apiTarget += `&sort_by=${sortBy}`;

                const res = await fetch(apiTarget);
                const data = await parseJsonOrThrow(res);

                const localRows = Array.isArray(data.localResults) ? data.localResults : [];
                const remoteRows = Array.isArray(data.remoteResults) ? data.remoteResults : [];

                if (!localRows.length && !remoteRows.length) {
                    grid.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding:40px; color:#94a3b8;">No matching movie indexes found.</div>';
                    return;
                }

                const parts = [];
                if (localRows.length) {
                    parts.push(`
                        <div class="section-head">
                            <strong>Already in Your Library</strong>
                            <span>${localRows.length} match(es)</span>
                        </div>
                    `);
                    parts.push(renderLocalMovieCards(localRows));
                }

                if (remoteRows.length) {
                    parts.push(`
                        <div class="section-head">
                            <strong>Add from Remote Catalog</strong>
                            <span>${remoteRows.length} result(s)</span>
                        </div>
                    `);
                    parts.push(renderRemoteMovieCards(remoteRows));
                }

                grid.innerHTML = parts.join('');
                renderPaginationControls(data.remoteTotal, data.remotePageLimit);
            } catch (_err) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding:40px; color:#f43f5e;">Error processing movie catalog requests.</div>';
            }
        }

        async function fetchShowCatalog() {
            const query = document.getElementById('searchIn').value.trim();
            const grid = document.getElementById('catalog-grid');
            const paginationWrapper = document.getElementById('pagination-wrapper');
            const limit = query ? 40 : 50;

            if (!grid || !paginationWrapper) return;

            paginationWrapper.innerHTML = '';
            const selectedCatalog = String(activeTvCatalogSlug || document.getElementById('tvCatalogIn').value || '').trim();

            grid.innerHTML = query
                ? '<div style="grid-column: 1/-1; text-align:center; padding:40px; color:#94a3b8;">Searching TV index...</div>'
                : '<div style="grid-column: 1/-1; text-align:center; padding:40px; color:#94a3b8;">Loading TV catalog...</div>';

            try {
                if (!query && selectedCatalog) {
                    const catRes = await fetch(`/api/catalogs/tv/${encodeURIComponent(selectedCatalog)}?limit=${limit}`);
                    const catData = await parseJsonOrThrow(catRes);
                    const items = Array.isArray(catData.items) ? catData.items : [];

                    if (!items.length) {
                        grid.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding:40px; color:#94a3b8;">Selected TV catalog has no entries.</div>';
                        return;
                    }

                    const title = escapeHtml(catData.title || 'TV Catalog');
                    grid.innerHTML = `
                        <div class="section-head">
                            <strong>${title}</strong>
                            <span>${items.length} shown</span>
                        </div>
                        ${renderTvCards(items)}
                    `;
                    return;
                }

                const res = await fetch(`/api/tv-shows/search?q=${encodeURIComponent(query)}&limit=${limit}`);
                const data = await parseJsonOrThrow(res);

                if (!data.success || !data.items || data.items.length === 0) {
                    if (query) {
                        const topRes = await fetch('/api/tv-shows/search?limit=50');
                        const topData = await parseJsonOrThrow(topRes);
                        if (topData.success && Array.isArray(topData.items) && topData.items.length > 0) {
                            grid.innerHTML = topData.items.map(show => show).length
                                ? `<div style="grid-column: 1/-1; text-align:center; padding:10px 8px 18px; color:#94a3b8;">No matches for "${query}". Showing top TV shows instead.</div>${renderTvCards(topData.items)}`
                                : '<div style="grid-column: 1/-1; text-align:center; padding:40px; color:#94a3b8;">No TV series found.</div>';
                            return;
                        }
                    }
                    grid.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding:40px; color:#94a3b8;">No matching TV series found.</div>';
                    return;
                }

                grid.innerHTML = renderTvCards(data.items);
            } catch (_err) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding:40px; color:#f43f5e;">Error loading TV index.</div>';
            }
        }

        async function loadShowTorrents(imdbId, showTitle) {
            const grid = document.getElementById('catalog-grid');
            const packsOnly = document.getElementById('packsOnlyIn').checked;
            const paginationWrapper = document.getElementById('pagination-wrapper');

            if (!grid || !paginationWrapper) return;

            paginationWrapper.innerHTML = '';
            grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding:40px; color:#94a3b8;">Loading releases for ${showTitle}...</div>`;

            try {
                const res = await fetch(`/api/eztv/browse?imdbId=${encodeURIComponent(imdbId)}&packsOnly=${packsOnly}&consolidated=false`);
                const data = await parseJsonOrThrow(res);

                if (!data.success || !data.torrents || data.torrents.length === 0) {
                    grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding:40px; color:#94a3b8;">No releases found for ${showTitle}.</div>`;
                    return;
                }

                const best = chooseBestEpisodeRows(data.torrents);
                const episodesBySeason = new Map();
                for (const row of best.episodes) {
                    const season = parseInt(row.season, 10);
                    if (!episodesBySeason.has(season)) episodesBySeason.set(season, []);
                    episodesBySeason.get(season).push(row);
                }

                const seasonSections = Array.from(episodesBySeason.entries())
                    .sort((a, b) => a[0] - b[0])
                    .map(([season, rows]) => {
                        const seededCount = rows.filter(r => (parseInt(r.seeds, 10) || 0) > 0).length;
                        return `
                            <details class="season-panel" open>
                                <summary class="season-summary"><strong>Season ${season}</strong><span>${rows.length} episodes • ${seededCount} seeded</span></summary>
                                <table class="episode-table">
                                    <thead>
                                        <tr><th>Episode</th><th>Size</th><th>Seeds</th><th>Action</th></tr>
                                    </thead>
                                    <tbody>
                                        ${renderEpisodeTableRows(rows)}
                                    </tbody>
                                </table>
                            </details>
                        `;
                    }).join('');

                const showCover = tvCoverByImdb[String(imdbId)] || (data.torrents[0] && data.torrents[0].cover) || '';

                grid.innerHTML = `
                    <div style="grid-column: 1/-1; display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:4px;">
                        <div>
                            <h2 style="margin:0 0 4px 0; font-size:1.1rem; color:#f8fafc;">${showTitle}</h2>
                            <div style="color:#94a3b8; font-size:0.85rem;">IMDb ${imdbId} • ${data.torrents.length} rows • Whole seasons only: ${packsOnly ? 'ON' : 'OFF'} • Mode: ${data.consolidated ? 'consolidated' : 'raw'}</div>
                            ${(typeof data.packRows === 'number' && typeof data.episodeRows === 'number') ? `<div style="color:#94a3b8; font-size:0.8rem; margin-top:4px;">Rows: ${data.packRows} pack • ${data.episodeRows} episode rows</div>` : ''}
                            ${(typeof data.totalEpisodeCandidates === 'number' && typeof data.uniqueEpisodeCandidates === 'number') ? `<div style="color:#94a3b8; font-size:0.8rem; margin-top:4px;">Episode candidates: ${data.totalEpisodeCandidates} • Unique SxE: ${data.uniqueEpisodeCandidates} • Seeded rows: ${data.nonZeroSeedRows || 0}</div>` : ''}
                            ${data.packsFallbackUsed ? '<div style="color:#f59e0b; font-size:0.8rem; margin-top:4px;">No seeded season packs found; showing unseeded pack rows where available.</div>' : ''}
                            ${Array.isArray(data.upstreamWarnings) && data.upstreamWarnings.length ? `<div style="color:#f97316; font-size:0.8rem; margin-top:4px;">${data.upstreamWarnings[0]}</div>` : ''}
                        </div>
                        <button class="page-btn" style="background:#334155;" onclick="fetchShowCatalog()">Back to Shows</button>
                    </div>
                    <div class="show-overview">
                        <img src="${sanitizeImageSrc(showCover)}" onerror="handleImageFallback(this)" alt="${escapeHtml(showTitle)} cover">
                        <div class="show-overview-meta">
                            <h2>${escapeHtml(showTitle)}</h2>
                            <div class="line">Grouped by season, then episode. Best seeded release selected per episode.</div>
                            <div class="line">Episodes shown: ${best.episodes.length} • Pack rows: ${best.packs.length}</div>
                        </div>
                    </div>
                    ${renderPackRows(best.packs)}
                    ${seasonSections || '<div style="grid-column: 1/-1; text-align:center; padding:40px; color:#94a3b8;">No episode rows available after filtering.</div>'}
                `;
            } catch (err) {
                grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding:40px; color:#f43f5e;">Error loading releases for this show. ${err && err.message ? err.message : ''}</div>`;
            }
        }

        function renderPaginationControls(totalMovies, pageLimit) {
            const paginationWrapper = document.getElementById('pagination-wrapper');
            if (!totalMovies || !pageLimit) return;

            const totalPages = Math.ceil(totalMovies / pageLimit);
            if (totalPages <= 1) return;

            paginationWrapper.innerHTML = `
                <div class="pagination-container">
                    <button class="page-btn" ${currentBrowsePage === 1 ? 'disabled' : ''} onclick="fetchMovieCatalog(${currentBrowsePage - 1})">◀ Previous</button>
                    <div class="page-indicator">Page ${currentBrowsePage} / ${totalPages}</div>
                    <button class="page-btn" ${currentBrowsePage === totalPages ? 'disabled' : ''} onclick="fetchMovieCatalog(${currentBrowsePage + 1})">Next ▶</button>
                </div>
            `;
        }

        async function addMediaAsset(btn, base64Magnet, targetCategory, imdbId = '', season = 0, episode = 0, sourceType = '') {
            const magnetUrl = atob(base64Magnet);
            btn.disabled = true;
            btn.style.background = '#475569';
            btn.innerText = 'Queuing...';

            const apiRoute = targetCategory === 'series-streamer' ? '/api/downloader/add' : '/api/yts/add';

            try {
                const parsedSeason = parseInt(season, 10);
                const parsedEpisode = parseInt(episode, 10);
                const queueContext = targetCategory === 'series-streamer'
                    ? {
                        imdbId: imdbId || '',
                        season: Number.isFinite(parsedSeason) && parsedSeason > 0 ? parsedSeason : null,
                        episode: Number.isFinite(parsedEpisode) && parsedEpisode > 0 ? parsedEpisode : null,
                        sourceType: sourceType || null
                    }
                    : null;

                const response = await fetch(apiRoute, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ magnetUrl, category: targetCategory, imdbId, queueContext })
                });

                if (!response.ok) throw new Error('Request failed');

                showToast(targetCategory === 'series-streamer'
                    ? 'Release pushed to series queue.'
                    : 'Added to movie queue.'
                );
                btn.innerText = 'Queued';
                btn.style.background = '#059669';
            } catch (_err) {
                showToast('Core pipeline rejected tracker linkage.');
                btn.disabled = false;
                btn.style.background = '#10b981';
                btn.innerText = targetCategory === 'series-streamer' ? 'Ingest Release' : 'Add to Library';
            }
        }

        function addManualMagnet(buttonObj) {
            const inputEl = document.getElementById('manualMagnetIn');
            const rawMagnet = inputEl.value.trim();

            if (!rawMagnet || !rawMagnet.toLowerCase().startsWith('magnet:?xt=')) {
                showToast('Invalid link format. Missing magnet header structure.');
                return;
            }

            buttonObj.disabled = true;
            buttonObj.innerText = 'Processing...';

            addMediaAsset(buttonObj, btoa(rawMagnet), currentMode === 'movies' ? 'movie-streamer' : 'series-streamer', '');
            inputEl.value = '';
            buttonObj.disabled = false;
            buttonObj.innerText = 'Ingest Link';
        }

        function showToast(msg) {
            const toast = document.getElementById('toastNotice');
            if (!toast) return;
            toast.innerText = msg;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 5000);
        }

        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const initialQuery = String(params.get('q') || '').trim();
            if (initialQuery) {
                const input = document.getElementById('searchIn');
                if (input) input.value = initialQuery;
            }
            loadCatalogList();
            loadTvCatalogList();
            fetchMovieCatalog(1);
        });
    </script>
</body>
</html>
