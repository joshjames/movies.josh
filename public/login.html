<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/images/icons/pwa-192.png">
    <title>AnyMovie Online Sign In</title>
    <style>
        :root {
            --login-bg: #020617;
            --card-bg: rgba(15, 23, 42, 0.9);
            --card-border: rgba(51, 65, 85, 0.95);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --brand-red: #ff121f;
            --brand-red-deep: #b90710;
        }

        body {
            background:
                linear-gradient(180deg, rgba(2, 6, 23, 0.76) 0%, rgba(2, 6, 23, 0.86) 100%),
                radial-gradient(circle at top, rgba(30, 41, 59, 0.2), transparent 46%),
                url('/css/login-background.jpg') center center / cover no-repeat fixed;
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .auth-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 24px 48px -16px rgba(0, 0, 0, 0.68);
            backdrop-filter: blur(8px);
        }

        .login-logo-wrapper {
            width: 100%;
            max-width: 260px;
            margin: 0 auto 20px auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            user-select: none;
        }

        .brand-arc {
            display: inline-block;
            color: var(--brand-red);
            font-size: clamp(2rem, 6vw, 2.7rem);
            font-weight: 900;
            letter-spacing: 0.18em;
            line-height: 1;
            text-transform: uppercase;
            text-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
            transform: perspective(520px) rotateX(28deg) scaleY(1.08);
            transform-origin: center bottom;
            white-space: nowrap;
            will-change: transform;
            -webkit-font-smoothing: antialiased;
            text-rendering: geometricPrecision;
        }

        .brand-sub {
            color: rgba(248, 250, 252, 0.92);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.9em;
            margin-top: 8px;
            margin-left: 0.9em;
            text-transform: uppercase;
        }

        h1 {
            font-size: 1.6rem;
            margin: 0 0 8px 0;
            margin-top: 0;
            margin-bottom: 8px;
            color: #f1f5f9;
            text-align: center;
        }

        .subtitle {
            font-size: 0.85rem;
            color: #64748b;
            text-align: center;
            margin-bottom: 28px;
            line-height: 1.4;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 18px;
        }

        #nameFieldGroup {
            display: none;
        }

        label {
            font-size: 0.75rem;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            background: rgba(2, 6, 23, 0.78);
            border: 1px solid #334155;
            color: white;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #2563eb;
        }

        .submit-btn {
            background: var(--brand-red);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .submit-btn:hover {
            background: var(--brand-red-deep);
        }

        .toggle-box {
            margin-top: 24px;
            text-align: center;
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .toggle-link {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        .utility-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: -8px;
            margin-bottom: 8px;
            font-size: 0.82rem;
        }

        .utility-link {
            color: #38bdf8;
            text-decoration: none;
            cursor: pointer;
        }

        .utility-link:hover {
            text-decoration: underline;
        }

        .banner {
            padding: 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-bottom: 20px;
            display: none;
            text-align: center;
            line-height: 1.4;
        }
        .banner-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid #ef4444;
            color: #f87171;
        }
        .banner-success {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid #10b981;
            color: #34d399;
        }

        .turnstile-wrap {
            margin: 12px 0 8px;
            display: none;
            justify-content: center;
        }

        @media (max-width: 560px) {
            body {
                padding: 14px;
                background-attachment: scroll;
            }

            .auth-card {
                padding: 28px 20px;
                border-radius: 14px;
            }

            .brand-sub {
                letter-spacing: 0.6em;
                margin-left: 0.6em;
            }
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <a class="login-logo-wrapper" href="/welcome.html" aria-label="Go to AnyMovie welcome page">
            <span class="brand-arc">AnyMovie</span>
            <span class="brand-sub">Online</span>
        </a>

        <h1 id="form-title">Sign In</h1>
        <div class="subtitle" id="form-subtitle">Access your library, queue, and watch history.</div>

        <div class="banner" id="alertBlock"></div>

        <form id="authForm" method="post" action="/api/auth/login" onsubmit="handleFormSubmit(event)">
            <div class="form-group">
                <label for="usernameIn" id="usernameLabel">Email Address</label>
                <input type="text" id="usernameIn" name="username" required autocomplete="username">
            </div>

            <div class="form-group" id="nameFieldGroup">
                <label for="nameIn">Full Name</label>
                <input type="text" id="nameIn" name="name" autocomplete="name">
            </div>

            <div class="form-group">
                <label for="passwordIn">Password</label>
                <input type="password" id="passwordIn" name="password" required autocomplete="current-password">
            </div>

            <div class="form-group" id="confirmPasswordGroup" style="display:none;">
                <label for="confirmPasswordIn">Confirm New Password</label>
                <input type="password" id="confirmPasswordIn" name="confirmPassword" autocomplete="new-password">
            </div>

            <div class="utility-row" id="utilityRow">
                <span class="utility-link" id="forgotPasswordLink" onclick="enterResetRequestMode()">Forgot password?</span>
                <span class="utility-link" id="backToLoginLink" onclick="exitResetMode()" style="display:none;">Back to login</span>
            </div>

            <div class="turnstile-wrap" id="turnstileWrap">
                <div class="cf-turnstile" data-action="turnstile-spin-v2" id="turnstileWidget"></div>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">Login</button>
        </form>

        <div class="toggle-box">
            <span id="toggleText">New to Anymovie?</span>
            <span class="toggle-link" id="toggleLink" onclick="toggleAuthMode()">Create a profile</span>
            <div style="margin-top:12px;"><a class="utility-link" href="/welcome.html">View the welcome page</a></div>
        </div>
    </div>

    <script>
        let isLoginMode = true;
        let isResetRequestMode = false;
        let resetToken = '';
        let resetUser = '';
        const turnstileState = {
            enabled: false,
            siteKey: '',
            widgetId: null,
            token: '',
            tokenIssuedAt: 0,
            pendingResolvers: []
        };

        function isResetConfirmMode() {
            return Boolean(resetToken && resetUser);
        }

        function updateModeUI() {
            const title = document.getElementById('form-title');
            const subtitle = document.getElementById('form-subtitle');
            const submitBtn = document.getElementById('submitBtn');
            const toggleText = document.getElementById('toggleText');
            const toggleLink = document.getElementById('toggleLink');
            const nameGroup = document.getElementById('nameFieldGroup');
            const nameInput = document.getElementById('nameIn');
            const userInput = document.getElementById('usernameIn');
            const usernameLabel = document.getElementById('usernameLabel');
            const passwordInput = document.getElementById('passwordIn');
            const confirmGroup = document.getElementById('confirmPasswordGroup');
            const confirmInput = document.getElementById('confirmPasswordIn');
            const utilityRow = document.getElementById('utilityRow');
            const forgotPasswordLink = document.getElementById('forgotPasswordLink');
            const backToLoginLink = document.getElementById('backToLoginLink');
            const toggleBox = document.querySelector('.toggle-box');

            if (isResetConfirmMode()) {
                title.innerText = 'Set a New Password';
                subtitle.innerText = 'Enter your new password below.';
                submitBtn.innerText = 'Update Password';

                nameGroup.style.display = 'none';
                nameInput.removeAttribute('required');

                usernameLabel.innerText = 'Email Address';
                userInput.setAttribute('type', 'text');
                userInput.setAttribute('name', 'username');
                userInput.value = resetUser;
                userInput.setAttribute('readonly', 'true');

                passwordInput.value = '';
                passwordInput.setAttribute('required', 'true');
                passwordInput.setAttribute('autocomplete', 'new-password');
                document.querySelector('label[for="passwordIn"]').innerText = 'New Password';

                confirmGroup.style.display = 'flex';
                confirmInput.setAttribute('required', 'true');

                utilityRow.style.display = 'none';
                toggleBox.style.display = 'none';
                return;
            }

            userInput.removeAttribute('readonly');
            userInput.value = userInput.value || '';
            userInput.setAttribute('type', 'text');
            userInput.setAttribute('name', 'username');
            passwordInput.setAttribute('autocomplete', isResetRequestMode ? 'off' : (isLoginMode ? 'current-password' : 'new-password'));
            document.querySelector('label[for="passwordIn"]').innerText = 'Password';

            confirmGroup.style.display = 'none';
            confirmInput.removeAttribute('required');
            confirmInput.value = '';

            toggleBox.style.display = 'block';
            utilityRow.style.display = 'flex';

            if (isResetRequestMode) {
                title.innerText = 'Reset Password';
                subtitle.innerText = 'Enter your email and we will send you a reset link.';
                submitBtn.innerText = 'Send Reset Email';
                usernameLabel.innerText = 'Email Address';
                document.getElementById('authForm').setAttribute('action', '/api/auth/password-reset/request');

                nameGroup.style.display = 'none';
                nameInput.removeAttribute('required');

                passwordInput.removeAttribute('required');
                passwordInput.value = '';
                passwordInput.parentElement.style.display = 'none';

                toggleText.innerText = 'Remembered your password?';
                toggleLink.innerText = 'Sign in here';

                forgotPasswordLink.style.display = 'none';
                backToLoginLink.style.display = 'inline';
                return;
            }

            passwordInput.parentElement.style.display = 'flex';
            passwordInput.setAttribute('required', 'true');
            forgotPasswordLink.style.display = isLoginMode ? 'inline' : 'none';
            backToLoginLink.style.display = 'none';

            if (isLoginMode) {
                title.innerText = 'Sign In';
                subtitle.innerText = 'Access your library, queue, and watch history.';
                submitBtn.innerText = 'Login to Anymovie';
                usernameLabel.innerText = 'Email or Username';
                document.getElementById('authForm').setAttribute('action', '/api/auth/login');
                toggleText.innerText = 'New to Anymovie?';
                toggleLink.innerText = 'Create a profile';

                nameGroup.style.display = 'none';
                nameInput.removeAttribute('required');
            } else {
                title.innerText = 'Create Your Profile';
                subtitle.innerText = 'Start your account and unlock the full library experience.';
                submitBtn.innerText = 'Register your account';
                usernameLabel.innerText = 'Email Address';
                document.getElementById('authForm').setAttribute('action', '/api/auth/register');
                toggleText.innerText = 'Already registered?';
                toggleLink.innerText = 'Sign in here';

                nameGroup.style.display = 'flex';
                nameInput.setAttribute('required', 'true');
            }
        }

        // Auto-check on initialization to look for verification query returns
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            resetToken = String(params.get('token') || '').trim();
            resetUser = String(params.get('user') || '').trim().toLowerCase();

            if (params.get('mode') === 'signup') {
                isLoginMode = false;
            }

            if (params.get('reset') === 'true' && (!resetToken || !resetUser)) {
                showAlert('Reset link is missing required parameters. Request a new one.', 'error');
            }

            if (params.get('reset') === 'true' && resetToken && resetUser) {
                isResetRequestMode = false;
                isLoginMode = true;
                updateModeUI();
            }

            if (params.get('verified') === 'true') {
                showAlert('Account activated successfully! You can now log in below.', 'success');
            }

            updateModeUI();
            initializeTurnstile();
        });

        function resolveTurnstileWaiters(token) {
            const waiters = [...turnstileState.pendingResolvers];
            turnstileState.pendingResolvers = [];
            waiters.forEach((resolve) => {
                try {
                    resolve(token);
                } catch (_err) {
                    // no-op
                }
            });
        }

        function clearTurnstileToken() {
            turnstileState.token = '';
            turnstileState.tokenIssuedAt = 0;
        }

        function onTurnstileSuccess(token) {
            turnstileState.token = String(token || '');
            turnstileState.tokenIssuedAt = Date.now();
            resolveTurnstileWaiters(turnstileState.token);
        }

        function onTurnstileExpired() {
            clearTurnstileToken();
        }

        function onTurnstileError() {
            clearTurnstileToken();
            resolveTurnstileWaiters('');
        }

        function isTurnstileTokenFresh() {
            return Boolean(turnstileState.token) && (Date.now() - Number(turnstileState.tokenIssuedAt || 0) < 240000);
        }

        function loadTurnstileScript() {
            return new Promise((resolve, reject) => {
                if (window.turnstile) return resolve();
                const existing = document.querySelector('script[data-turnstile-sdk="true"]');
                if (existing) {
                    existing.addEventListener('load', () => resolve(), { once: true });
                    existing.addEventListener('error', () => reject(new Error('turnstile_script_failed')), { once: true });
                    return;
                }

                const script = document.createElement('script');
                script.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
                script.async = true;
                script.defer = true;
                script.dataset.turnstileSdk = 'true';
                script.onload = () => resolve();
                script.onerror = () => reject(new Error('turnstile_script_failed'));
                document.head.appendChild(script);
            });
        }

        function renderTurnstileWidget() {
            if (!turnstileState.enabled || !turnstileState.siteKey || !window.turnstile) return;
            if (turnstileState.widgetId !== null) return;

            const wrap = document.getElementById('turnstileWrap');
            wrap.style.display = 'flex';

            turnstileState.widgetId = window.turnstile.render('#turnstileWidget', {
                sitekey: turnstileState.siteKey,
                action: 'turnstile-spin-v2',
                appearance: 'interaction-only',
                theme: 'dark',
                callback: onTurnstileSuccess,
                'expired-callback': onTurnstileExpired,
                'error-callback': onTurnstileError
            });
        }

        async function initializeTurnstile() {
            try {
                const response = await fetch('/api/auth/turnstile-config', {
                    headers: { 'Accept': 'application/json' },
                    credentials: 'same-origin'
                });
                const data = await response.json().catch(() => ({}));
                if (!response.ok || !data.success || !data.enabled || !data.siteKey) {
                    turnstileState.enabled = false;
                    return;
                }

                turnstileState.enabled = true;
                turnstileState.siteKey = String(data.siteKey || '').trim();

                await loadTurnstileScript();
                renderTurnstileWidget();
            } catch (_err) {
                turnstileState.enabled = false;
            }
        }

        // Turnstile is a best-effort bot check, not a login gate: if the widget
        // never loads, times out, or errors, we resolve with an empty token
        // instead of throwing so the login/register request still reaches the
        // server (which itself fails open on a missing token). Previously this
        // threw, which blocked the request before it was ever sent - matching
        // the "ambiguous failed login" reports when the widget had trouble.
        async function ensureTurnstileToken() {
            if (!turnstileState.enabled) return '';
            if (isTurnstileTokenFresh()) return turnstileState.token;
            if (!window.turnstile || turnstileState.widgetId === null) {
                console.warn('[turnstile] widget unavailable, proceeding without a token');
                return '';
            }

            return await new Promise((resolve) => {
                const timeout = setTimeout(() => {
                    console.warn('[turnstile] token request timed out, proceeding without a token');
                    resolve('');
                }, 12000);

                turnstileState.pendingResolvers.push((token) => {
                    clearTimeout(timeout);
                    if (!token) {
                        console.warn('[turnstile] widget reported an error, proceeding without a token');
                    }
                    resolve(token || '');
                });

                clearTurnstileToken();
                window.turnstile.execute(turnstileState.widgetId);
            });
        }

        function showAlert(message, type) {
            const block = document.getElementById('alertBlock');
            block.innerText = message;
            block.className = `banner banner-${type}`;
            block.style.display = 'block';
        }

        function isValidEmail(value) {
            const raw = String(value || '').trim();
            return raw.includes('@') && raw.includes('.');
        }

        function toggleAuthMode() {
            if (isResetConfirmMode()) return;

            isLoginMode = !isLoginMode;
            isResetRequestMode = false;
            document.getElementById('alertBlock').style.display = 'none';
            updateModeUI();
        }

        function enterResetRequestMode() {
            if (isResetConfirmMode()) return;
            isResetRequestMode = true;
            isLoginMode = true;
            document.getElementById('alertBlock').style.display = 'none';
            updateModeUI();
        }

        function exitResetMode() {
            if (isResetConfirmMode()) return;
            isResetRequestMode = false;
            isLoginMode = true;
            document.getElementById('alertBlock').style.display = 'none';
            updateModeUI();
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            document.getElementById('alertBlock').style.display = 'none';

            const username = document.getElementById('usernameIn').value.trim();
            const password = document.getElementById('passwordIn').value;
            const confirmPassword = document.getElementById('confirmPasswordIn').value;

            if (isResetConfirmMode()) {
                if (!password || password.length < 6) {
                    showAlert('Please choose a password with at least 6 characters.', 'error');
                    return;
                }
                if (password !== confirmPassword) {
                    showAlert('New password and confirmation do not match.', 'error');
                    return;
                }

                try {
                    const turnstileToken = await ensureTurnstileToken();
                    const response = await fetch('/api/auth/password-reset/confirm', {
                        method: 'POST',
                        headers: {
                            'Accept': 'application/json',
                            'Content-Type': 'application/json'
                        },
                        credentials: 'same-origin',
                        body: JSON.stringify({
                            user: resetUser,
                            token: resetToken,
                            newPassword: password,
                            turnstileToken,
                            'cf-turnstile-response': turnstileToken
                        })
                    });

                    const data = await response.json().catch(() => ({}));
                    if (response.ok && data.success) {
                        showAlert('Password updated successfully. Please log in with your new password.', 'success');
                        const url = new URL(window.location.href);
                        url.searchParams.delete('reset');
                        url.searchParams.delete('token');
                        url.searchParams.delete('user');
                        window.history.replaceState({}, '', `${url.pathname}${url.search}`);
                        resetToken = '';
                        resetUser = '';
                        isLoginMode = true;
                        isResetRequestMode = false;
                        document.getElementById('authForm').reset();
                        updateModeUI();
                    } else {
                        showAlert(data.error || 'Unable to reset password.', 'error');
                    }
                } catch (err) {
                    console.error('[password-reset/confirm] request failed:', err);
                    showAlert('Network error - could not reach the server. Please check your connection and try again.', 'error');
                }
                return;
            }

            if (isResetRequestMode) {
                if (!isValidEmail(username)) {
                    showAlert('Please enter a valid email address.', 'error');
                    return;
                }
                try {
                    const turnstileToken = await ensureTurnstileToken();
                    const response = await fetch('/api/auth/password-reset/request', {
                        method: 'POST',
                        headers: {
                            'Accept': 'application/json',
                            'Content-Type': 'application/json'
                        },
                        credentials: 'same-origin',
                        body: JSON.stringify({
                            email: username,
                            username,
                            turnstileToken,
                            'cf-turnstile-response': turnstileToken
                        })
                    });

                    const data = await response.json().catch(() => ({}));
                    if (response.ok && data.success) {
                        showAlert(data.message || 'If that email is registered, a reset link has been sent.', 'success');
                    } else {
                        showAlert(data.error || 'Unable to process password reset request.', 'error');
                    }
                } catch (err) {
                    console.error('[password-reset/request] request failed:', err);
                    showAlert('Network error - could not reach the server. Please check your connection and try again.', 'error');
                }
                return;
            }

            const payload = { email: username, username, password };

            if (!isLoginMode && !isValidEmail(username)) {
                showAlert('Please enter a valid email address.', 'error');
                return;
            }
            
            if (!isLoginMode) {
                payload.name = document.getElementById('nameIn').value;
            }

            const targetEndpoint = isLoginMode ? '/api/auth/login' : '/api/auth/register';
            document.getElementById('authForm').setAttribute('action', targetEndpoint);

            try {
                const turnstileToken = await ensureTurnstileToken();
                const response = await fetch(targetEndpoint, {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    },
                    credentials: 'same-origin',
                    body: JSON.stringify({
                        ...payload,
                        turnstileToken,
                        'cf-turnstile-response': turnstileToken
                    })
                });

                const data = await response.json().catch(() => ({}));

                if (response.ok && data.success) {
                    if (isLoginMode) {
                        window.location.replace('/');
                    } else {
                        // Registration success: Clear fields and show notice
                        document.getElementById('authForm').reset();
                        showAlert(data.message, "success");
                    }
                } else {
                    showAlert(data.error || 'Unable to complete authentication request.', 'error');
                }
            } catch (err) {
                console.error('[auth] request failed:', err);
                showAlert('Network error - could not reach the server. Please check your connection and try again.', 'error');
            }
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(() => {
                    // Silent on login page; PWA registration is best-effort here.
                });
            });
        }
    </script>
    <script src="/js/api-failover.js"></script>
</body>
</html>
