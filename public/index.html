<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/images/icons/pwa-192.png">
    <title>Stream Server</title>
    <style>
        * { box-sizing: border-box; }
        
        body { 
            background: #0f172a; 
            color: #f8fafc; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; 
            padding: 10px; 
            overflow-x: hidden;
        }

        /* Layout Alignment Wrapper Engine */
        .main-header {
            width: 100%;
            background: #0f172a;
            padding: 12px 10px;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between; 
            align-items: center;
            gap: 16px;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 16px;
        }

        /* Precise Sizing Control for the Arched Vector SVG Asset */
        .logo-wrapper {
            width: 160px; 
            display: flex;
            align-items: center;
        }

        .logo-wrapper svg {
            width: 100%;
            height: auto;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .logo-wrapper svg:hover {
            transform: scale(1.05);
        }

        .left-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .right-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .home-search-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .home-search-input {
            width: min(360px, 42vw);
            background: #0b1220;
            color: #e2e8f0;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 9px 12px;
            font-size: 0.84rem;
            outline: none;
        }

        .home-search-input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        .home-search-btn {
            background: #1d4ed8;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 9px 12px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }

        .home-search-btn:hover {
            background: #1e40af;
        }

        .home-search-panel {
            max-width: 1400px;
            margin: 14px auto 0 auto;
            padding: 0 10px;
            display: none;
        }

        .home-search-panel.show {
            display: block;
        }

        .news-banner-wrap {
            max-width: 1200px;
            margin: 14px auto 0 auto;
            padding: 0 10px;
        }

        .news-banner-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            text-decoration: none;
            border: 1px solid #334155;
            border-left: 4px solid #f59e0b;
            border-radius: 12px;
            background: linear-gradient(135deg, #111827 0%, #0b1220 100%);
            color: #f8fafc;
            padding: 12px 14px;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.26);
            transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
        }

        .news-banner-link:hover {
            transform: translateY(-1px);
            border-color: #475569;
            box-shadow: 0 12px 22px rgba(0, 0, 0, 0.32);
        }

        .news-banner-main {
            display: grid;
            gap: 2px;
        }

        .news-banner-title {
            font-size: 0.95rem;
            font-weight: 800;
            letter-spacing: 0.01em;
            color: #fde68a;
        }

        .news-banner-sub {
            font-size: 0.8rem;
            color: #cbd5e1;
        }

        .news-banner-cta {
            font-size: 0.78rem;
            font-weight: 700;
            color: #93c5fd;
            white-space: nowrap;
        }

        .home-search-box {
            background: #0b1220;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 12px;
        }

        .home-search-meta {
            color: #94a3b8;
            font-size: 0.82rem;
            margin-bottom: 10px;
        }

        .home-search-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
        }

        .home-search-card {
            background: #111827;
            border: 1px solid #334155;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .home-search-card.local {
            border-color: #166534;
            box-shadow: inset 0 0 0 1px rgba(22, 163, 74, 0.25);
        }

        .home-search-cover {
            width: 100%;
            aspect-ratio: 2 / 3;
            background: #020617;
            object-fit: cover;
        }

        .home-search-info {
            padding: 10px;
            display: grid;
            gap: 6px;
        }

        .home-search-title {
            color: #f8fafc;
            font-size: 0.86rem;
            font-weight: 700;
            line-height: 1.3;
        }

        .home-search-sub {
            color: #94a3b8;
            font-size: 0.74rem;
        }

        .home-search-link {
            display: inline-block;
            text-decoration: none;
            background: #2563eb;
            color: #fff;
            text-align: center;
            border-radius: 7px;
            padding: 8px 10px;
            font-size: 0.78rem;
            font-weight: 700;
        }

        .home-search-link:hover {
            background: #1d4ed8;
        }

        .admin-mini-btn {
            display: none;
            width: 34px;
            height: 34px;
            border-radius: 999px;
            text-decoration: none;
            align-items: center;
            justify-content: center;
            background: #7e22ce;
            border: 1px solid #9333ea;
            color: #ffffff;
            font-size: 0.95rem;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
        }

        .admin-mini-btn:hover {
            background: #9333ea;
        }

        .avatar-wrap {
            position: relative;
        }

        .avatar-bell {
            position: absolute;
            right: 8px;
            top: 4px;
            width: 22px;
            height: 22px;
            border-radius: 999px;
            border: 2px solid #0b1220;
            background: #2563eb;
            color: #e2e8f0;
            font-size: 12px;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
            pointer-events: none;
            z-index: 4;
        }

        .avatar-bell[data-has-unread="true"] {
            background: #b91c1c;
            animation: bellPulse 1.5s ease-in-out infinite;
        }

        @keyframes bellPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        .avatar-btn {
            width: 64px;
            height: 64px;
            border-radius: 999px;
            border: 4px solid #e50914;
            background: #0b1220;
            padding: 0;
            cursor: pointer;
            overflow: hidden;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 0 6px rgba(185, 28, 28, 0.9), 0 4px 10px rgba(0, 0, 0, 0.3);
            transition: transform 0.15s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .avatar-btn:hover,
        .avatar-btn:focus-visible {
            border-color: #fb7185;
            box-shadow: inset 0 0 0 6px rgba(225, 29, 72, 0.95), 0 6px 14px rgba(0, 0, 0, 0.35);
            transform: translateY(-1px);
            outline: none;
        }

        .avatar-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar-wrap::after {
            content: '\2261';
            position: absolute;
            right: -2px;
            bottom: -2px;
            width: 20px;
            height: 20px;
            border-radius: 999px;
            border: 2px solid #e50914;
            background: #0b1220;
            color: #e2e8f0;
            font-size: 12px;
            font-weight: 900;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.45);
            pointer-events: none;
            z-index: 3;
        }

        .avatar-menu {
            position: absolute;
            right: 0;
            top: 72px;
            min-width: 320px;
            background: #0b1220;
            border: 1px solid #334155;
            border-radius: 6px; 
            padding: 6px;
            display: none;
            z-index: 50;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.35);
        }

        .avatar-menu.show {
            display: block;
        }

        .avatar-menu-header {
            color: #94a3b8;
            font-size: 0.75rem;
            padding: 6px 10px;
            border-bottom: 1px solid #1e293b;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .avatar-item {
            display: block;
            width: 100%;
            text-align: left;
            background: transparent;
            border: none;
            color: #e2e8f0;
            text-decoration: none;
            font-size: 0.85rem;
            padding: 8px 10px;
            border-radius: 6px;
            cursor: pointer;
        }

        .avatar-item:hover {
            background: #1e293b;
        }

        .avatar-menu-divider {
            border-top: 1px solid #1e293b;
            margin: 6px 2px;
        }

        .notify-panel {
            padding: 6px 8px 8px 8px;
            display: grid;
            gap: 8px;
            max-height: 300px;
            overflow: auto;
        }

        .notify-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            color: #cbd5e1;
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .notify-counts {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .notify-chip {
            background: #111827;
            border: 1px solid #334155;
            color: #94a3b8;
            border-radius: 999px;
            padding: 2px 8px;
            font-size: 0.68rem;
            font-weight: 700;
        }

        .notify-list {
            display: grid;
            gap: 6px;
        }

        .notify-item {
            border: 1px solid #223047;
            background: #0f172a;
            border-radius: 8px;
            padding: 8px;
            display: grid;
            gap: 3px;
        }

        .notify-item-title {
            color: #f8fafc;
            font-size: 0.78rem;
            font-weight: 700;
            line-height: 1.25;
        }

        .notify-item-body {
            color: #cbd5e1;
            font-size: 0.72rem;
            line-height: 1.3;
        }

        .notify-item-meta {
            color: #94a3b8;
            font-size: 0.67rem;
        }

        .notify-link {
            color: #93c5fd;
            text-decoration: none;
        }

        .notify-empty {
            color: #94a3b8;
            font-size: 0.74rem;
            text-align: center;
            padding: 8px 0;
        }

        /* Right Section: Navigation Controls */
        .browse-nav-btn {
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.85rem;
            display: inline-block;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: background 0.2s ease;
            white-space: nowrap;
        }

        .browse-nav-btn:hover {
            background: #1d4ed8;
        }

        .install-app-btn {
            display: none;
            align-items: center;
            justify-content: center;
            background: #059669;
            color: #ffffff;
            border: 1px solid #10b981;
            border-radius: 8px;
            padding: 10px 14px;
            font-weight: 700;
            font-size: 0.82rem;
            cursor: pointer;
            white-space: nowrap;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .install-app-btn:hover {
            background: #047857;
        }

        .install-app-btn:disabled {
            opacity: 0.65;
            cursor: default;
        }

        /* Horizontal Home Collections */
        .collections {
            max-width: 1400px;
            margin: 10px auto 0 auto;
            padding: 0 10px 30px 10px;
        }

        .collection-row {
            margin: 0 0 30px 0;
        }

        .scroller-title {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
            margin: 0 0 10px 0;
            padding: 0 4px;
        }

        .scroller-title-main {
            display: flex;
            align-items: baseline;
            gap: 12px;
            min-width: 0;
        }

        .scroller-title h2 {
            margin: 0;
            font-size: 1.1rem;
            color: #f1f5f9;
        }

        .scroller-title span {
            color: #94a3b8;
            font-size: 0.8rem;
        }

        .view-all-link {
            color: #93c5fd;
            text-decoration: none;
            font-size: 0.78rem;
            font-weight: 700;
            white-space: nowrap;
            border: 1px solid #334155;
            border-radius: 999px;
            padding: 4px 10px;
            background: #111827;
        }

        .view-all-link:hover {
            color: #dbeafe;
            border-color: #3b82f6;
            background: #0f1b31;
        }

        .slider-wrapper {
            position: relative;
            overflow: visible;
        }

        .movie-slider {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            scroll-behavior: smooth;
            padding: 10px 46px 18px 46px;
            scrollbar-width: none;
            scroll-snap-type: x mandatory;
        }

        .movie-slider::-webkit-scrollbar { display: none; }

        .slider-card {
            flex: 0 0 150px;
            position: relative;
            aspect-ratio: 2 / 3;
            background: #1e293b;
            border-radius: 10px;
            overflow: hidden;
            text-decoration: none;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
            transition: transform 0.25s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.25s;
            transform-origin: center center;
            scroll-snap-align: start;
        }

        .slider-card:hover {
            transform: scale(1.06);
            z-index: 8;
            box-shadow: 0 18px 24px -8px rgba(0, 0, 0, 0.65);
        }

        .slider-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 20%;
            display: block;
        }

        .slider-card-overlay {
            position: absolute;
            left: 0; right: 0; bottom: 0;
            background: linear-gradient(180deg, rgba(15,23,42,0) 0%, rgba(15,23,42,0.96) 88%);
            padding: 24px 10px 10px 10px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .slider-card-overlay .title {
            font-size: 0.92rem;
            font-weight: 700;
            color: #f1f5f9;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .slider-card-overlay .meta-line {
            font-size: 0.72rem;
            color: #94a3b8;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .slider-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            z-index: 2;
            background: #6366f1;
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .arrow__btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 46px;
            height: 84px;
            border: none;
            background: rgba(15, 23, 42, 0.78);
            color: #fff;
            font-size: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 30;
            cursor: pointer;
            transition: background 0.2s, color 0.2s, opacity 0.2s;
            user-select: none;
            border-radius: 8px;
            opacity: 0.95;
            pointer-events: auto;
            box-shadow: 0 6px 16px rgba(2, 6, 23, 0.45);
        }

        .arrow__btn:hover { background: rgba(15, 23, 42, 0.98); color: #e50914; }
        .left-arrow { left: -10px; }
        .right-arrow { right: -10px; }

        .collection-empty {
            color: #64748b;
            padding: 18px 8px 6px 8px;
            font-size: 0.9rem;
        }

                /* Container for alignment */
        .brand-logo-container {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            line-height: 1;
            font-family: 'Helvetica Neue', Arial, sans-serif; /* Adjust to match your current font choice */
        }

        /* The upper arced text string */
        .logo-main-arc {
            color: #E50914; /* Netflix/Joshflix core structural red */
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            
            /* 3D Transform to simulate a cinematic lens arc distortion */
            transform: perspective(100px) rotateX(15deg) scaleY(1.1);
            display: inline-block;
            
            /* Subtle text shadow to give it depth on a dark UI background */
            text-shadow: 0px 4px 10px rgba(0, 0, 0, 0.7);
        }

        /* The lower aligned element text string */
        .logo-sub-text {
            color: #FFFFFF; /* High contrast white text */
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 6px; /* High tracking spacing to make it fit evenly under the main text frame */
            text-transform: uppercase;
            margin-top: -2px; /* Pulls it up slightly so it nests nicely right inside the curve line */
            opacity: 0.9;
        }

        /* Tablet/Desktop expansion sizing overrides */
        @media(min-width: 640px) {
            body { padding: 20px; }
            .main-header { padding: 20px 0; }
            .logo-wrapper { width: 220px; } 
            .browse-nav-btn { padding: 12px 24px; font-size: 0.95rem; }
            .movie-slider { padding-left: 56px; padding-right: 56px; }
            .slider-card { flex-basis: 180px; }
        }

        @media(max-width: 760px) {
            .header-content {
                display: grid;
                grid-template-columns: auto 1fr;
                grid-template-areas:
                    "logo right"
                    "search search";
                align-items: center;
                gap: 10px;
            }

            .left-actions {
                display: none;
            }

            .right-actions {
                grid-area: right;
                min-width: 0;
                display: flex;
                align-items: center;
                align-items: center;
                justify-items: end;
                width: 100%;
            }

            .home-search-wrap {
                grid-area: search;
                margin-top: 8px;
                margin-top: 4px;
                justify-self: stretch;
            }

            .home-search-input {
                width: 100%;
                min-width: 0;
                flex: 1;
                padding: 8px 10px;
                font-size: 0.78rem;
            }

            .browse-nav-btn {
                padding: 8px 10px;
                font-size: 0.78rem;
            }

            .install-app-btn {
                padding: 8px 10px;
                font-size: 0.74rem;
            }

            .home-search-btn {
                padding: 8px 10px;
                font-size: 0.74rem;
            }

            .avatar-btn {
                width: 52px;
                height: 52px;
                border-width: 3px;
                box-shadow: inset 0 0 0 4px rgba(185, 28, 28, 0.9), 0 4px 10px rgba(0, 0, 0, 0.3);
            }

            .avatar-wrap::after {
                right: -1px;
                bottom: -1px;
                width: 17px;
                height: 17px;
                font-size: 10px;
                border-width: 2px;
            }

            .avatar-bell {
                width: 20px;
                height: 20px;
                right: 6px;
                top: 2px;
                font-size: 11px;
            }

            .avatar-menu {
                right: -8px;
                top: 60px;
                min-width: min(92vw, 360px);
                max-width: min(92vw, 360px);
            }

            .notify-panel {
                max-height: 44vh;
            }

            .logo-wrapper {
                grid-area: logo;
                width: 150px;
                justify-self: start;
            }

            .main-header,
            .collections,
            .home-search-panel {
                overflow-x: clip;
            }

            .home-search-box {
                padding: 8px;
            }

            .home-search-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 8px;
            }

            .home-search-info {
                padding: 8px;
                gap: 4px;
            }

            .home-search-title {
                font-size: 0.78rem;
            }

            .home-search-sub {
                font-size: 0.68rem;
            }

            .home-search-link {
                padding: 6px 8px;
                font-size: 0.72rem;
            }

            .movie-slider {
                padding-left: 40px;
                padding-right: 40px;
            }
        }
    </style>
</head>
<body>

    <header class="main-header">
        <div class="header-content">
           

            <div class="left-actions">
                <a href="/admin.html" id="admin-action-btn" class="admin-mini-btn" aria-label="Admin Desk" title="Admin Desk">🛠️</a>
            </div>

            <div class="logo-wrapper" onclick="window.location.href='/';">
    <svg viewBox="0 0 500 135" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <path id="textArchPath" d="M 50,85 Q 250,35 450,85" fill="none" />
            
            <filter id="cinematicGlow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.9" />
                <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#b91c1c" flood-opacity="0.4" />
            </filter>
        </defs>

        <text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
              font-size="52" 
              font-weight="900" 
              letter-spacing="5" 
              fill="#e50914" 
              filter="url(#cinematicGlow)">
            <textPath href="#textArchPath" startOffset="50%" text-anchor="middle">
                ANYMOVIE
            </textPath>
        </text>

        <text x="50%" 
              y="118" 
              font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
              font-size="16" 
              font-weight="700" 
              letter-spacing="14" 
              fill="#ffffff" 
              text-anchor="middle"
              opacity="0.9">
            ONLINE
        </text>
    </svg>
</div>

            <div class="home-search-wrap">
                <input type="text" id="home-search-input" class="home-search-input" placeholder="Search library, then catalog..." aria-label="Search movies">
                <button type="button" class="home-search-btn" id="home-search-btn">Search</button>
            </div>

            <div class="right-actions">
                <button type="button" class="install-app-btn" id="install-app-btn">Install App</button>
                <a href="/browse.html" class="browse-nav-btn">🔍 Browse Catalog</a>
                <div class="avatar-wrap">
                    <button type="button" class="avatar-btn" id="avatar-btn" aria-label="Open account menu">
                        <img src="/images/avatar.png" alt="User avatar" id="header-avatar-image">
                    </button>
                    <span class="avatar-bell" id="avatar-bell" data-has-unread="false" aria-hidden="true">🔔</span>
                    <div class="avatar-menu" id="avatar-menu">
                        <div class="avatar-menu-header" id="avatar-menu-user">Signed in</div>
                        <a href="/queue.html" class="avatar-item">Queue Manager</a>
                        <a href="/account.html" class="avatar-item">Account</a>
                        <a href="/api/auth/logout" class="avatar-item">Logout</a>
                        <div class="avatar-menu-divider"></div>
                        <section class="notify-panel" id="notify-panel">
                            <div class="notify-header">
                                <span>Notifications</span>
                                <div class="notify-counts" id="notify-counts"></div>
                            </div>
                            <div class="notify-list" id="notify-list"></div>
                        </section>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <section id="home-search-panel" class="home-search-panel">
        <div class="home-search-box">
            <div class="home-search-meta" id="home-search-meta"></div>
            <div class="home-search-grid" id="home-search-grid"></div>
        </div>
    </section>

    <section class="news-banner-wrap" aria-label="News and updates">
        <a href="/news.html" class="news-banner-link">
            <div class="news-banner-main">
                <div class="news-banner-title">📰✨ News & Updates</div>
                <div class="news-banner-sub">Feature updates, fixes, and upcoming plans from the Any Movie team.</div>
            </div>
            <div class="news-banner-cta">Open Feed →</div>
        </a>
    </section>

    <div class="collections" id="movie-grid"></div>

    <div id="pagination-container" style="display: none;"></div>

    <div style="display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 20px;">
        <a href="/browse.html" style="background: #2563eb; color: white; text-decoration: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; font-size: 0.9rem; display: inline-block; box-shadow: 0 4px 6px rgba(0,0,0,0.2);">
            🔍 Browse & Add New Movies
        </a>
        <a href="/queue.html" style="background: #0f766e; color: white; text-decoration: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; font-size: 0.9rem; display: inline-block; box-shadow: 0 4px 6px rgba(0,0,0,0.2);">
            📋 Open Queue Manager
        </a>
    </div>

    <div id="pipeline-monitor" style="max-width: 1200px; margin: 40px auto 20px auto; background: #1e293b; border-radius: 12px; padding: 20px; border: 1px solid #334155; display: none;">
        <h3 style="margin-top: 0; color: #3b82f6; font-size: 1.1rem; display: flex; align-items: center; gap: 8px;">
            ⚙️ System Ingestion & Processing Pipeline
        </h3>
        <div id="pipeline-scope-label" style="font-size: 0.78rem; color: #94a3b8; margin-bottom: 10px;"></div>
        <div id="pipeline-rows" style="display: flex; flex-direction: column; gap: 12px;"></div>
    </div>

    <script>
        let currentCatalogPage = 1;
        let homeSearchCards = [];
        let deferredInstallPrompt = null;
        let headerNotifications = null;
        const NO_COVER_DATA_URI = "data:image/svg+xml;utf8,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20width%3D'200'%20height%3D'300'%3E%3Crect%20width%3D'100%25'%20height%3D'100%25'%20fill%3D'%23020617'%2F%3E%3Ctext%20x%3D'50%25'%20y%3D'50%25'%20dominant-baseline%3D'middle'%20text-anchor%3D'middle'%20fill%3D'%23475569'%3ENo%20Cover%3C%2Ftext%3E%3C%2Fsvg%3E";

        function isStandaloneMode() {
            return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
        }

        function updateInstallButton() {
            const installButton = document.getElementById('install-app-btn');
            if (!installButton) return;

            if (isStandaloneMode()) {
                installButton.style.display = 'none';
                installButton.disabled = true;
                return;
            }

            if (deferredInstallPrompt) {
                installButton.style.display = 'inline-flex';
                installButton.disabled = false;
                installButton.textContent = 'Install App';
                return;
            }

            installButton.style.display = 'none';
            installButton.disabled = true;
        }

        function normalizeSearchText(value) {
            return String(value || '')
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();
        }

        function safeNumber(value) {
            const parsed = parseFloat(value);
            return Number.isFinite(parsed) ? parsed : null;
        }

        function normalizeGenres(media) {
            const raw = media.genre || media.enrichment?.genre || '';
            return String(raw)
                .split(',')
                .map(item => item.trim())
                .filter(Boolean);
        }

        function getScore(media) {
            return safeNumber(media.imdbScore || media.rating || media.enrichment?.imdbScore);
        }

        async function fetchAllMovies() {
            const pageSize = 100;
            let page = 1;
            let totalPages = 1;
            const all = [];

            while (page <= totalPages) {
                const res = await fetch(`/api/movies?page=${page}&limit=${pageSize}`);
                const data = await res.json();
                if (!data || !Array.isArray(data.movies)) break;

                all.push(...data.movies);
                totalPages = data.totalPages || 1;
                page += 1;
            }

            return all;
        }

        function buildSliderCard(media) {
            const targetEndpoint = (media.contentType === 'series') ? 'series.html' : 'player.html';
            const badgeHtml = (media.contentType === 'series')
                ? '<span class="slider-badge">TV Show</span>'
                : '';
            const genreText = media.genre || media.enrichment?.genre || '';
            const scoreText = media.imdbScore || media.rating || media.enrichment?.imdbScore || '';
            const metaBits = [media.year || '', genreText, scoreText ? `IMDb ${scoreText}` : ''].filter(Boolean).join(' · ');
            const cover = sanitizeImageSrc(media.cover);

            return `
                <a class="slider-card" href="${targetEndpoint}?id=${media.id}">
                    ${badgeHtml}
                    <img src="${cover}" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'200\' height=\'300\' viewBox=\'0 0 200 300\'><rect width=\'100%\' height=\'100%\' fill=\'%23020617\'/><text x=\'50%\' y=\'50%\' dominant-baseline=\'middle\' text-anchor=\'middle\' fill=\'%23475569\' font-family=\'sans-serif\' font-size=\'14\'>No Cover</text></svg>';" alt="${media.title}">
                    <div class="slider-card-overlay">
                        <div class="title">${media.title}</div>
                        <div class="meta-line">${metaBits}</div>
                    </div>
                </a>
            `;
        }

        function renderSliderRow(title, subtitle, items, rowId, options = {}) {
            const cards = items.length > 0
                ? items.map(buildSliderCard).join('')
                : '<div class="collection-empty">No titles found for this collection.</div>';
            const viewAllHref = String(options.viewAllHref || '').trim();
            const viewAllHtml = viewAllHref
                ? `<a class="view-all-link" href="${viewAllHref}">View all</a>`
                : '';

            return `
                <section class="collection-row">
                    <div class="scroller-title">
                        <div class="scroller-title-main">
                            <h2>${title}</h2>
                            ${subtitle ? `<span>${subtitle}</span>` : ''}
                        </div>
                        ${viewAllHtml}
                    </div>
                    <div class="slider-wrapper">
                        <button class="arrow__btn left-arrow" type="button" onclick="scrollSlider('${rowId}', -1)">‹</button>
                        <div class="movie-slider" id="${rowId}">${cards}</div>
                        <button class="arrow__btn right-arrow" type="button" onclick="scrollSlider('${rowId}', 1)">›</button>
                    </div>
                </section>
            `;
        }

        function getCollectionViewAllHref(collection) {
            const id = String(collection?.id || '').trim();
            const title = String(collection?.title || '').trim();
            const encodeQueryValue = (value) => encodeURIComponent(String(value || '').trim());

            if (!id) return '';
            if (id === 'my-library-row') return '';
            if (id === 'recently-added-row') {
                return `/gridview.html?title=${encodeQueryValue('Recently Added')}&sort=recent`;
            }
            if (id === 'top-rated-row') {
                return `/gridview.html?title=${encodeQueryValue('Top Rated')}&sort=score&minScore=8`;
            }
            if (id === 'series-row') {
                return `/gridview.html?title=${encodeQueryValue('TV Shows')}&type=series&sort=title`;
            }
            if (id.startsWith('genre-') && title) {
                return `/gridview.html?title=${encodeQueryValue(title)}&genre=${encodeQueryValue(title)}&sort=title`;
            }

            return `/gridview.html?title=${encodeQueryValue(title || 'Grid View')}&sort=recent`;
        }

        function renderFeedRow(collection) {
            const cards = Array.isArray(collection.cards) && collection.cards.length > 0
                    ? collection.cards.map(card => {
                        const badgeText = escapeHtml(String(card.badge || '').trim());
                        const badgeHtml = badgeText ? `<span class="slider-badge">${badgeText}</span>` : '';
                    const metaBits = [card.year || '', card.genre || '', card.imdbScore ? `IMDb ${card.imdbScore}` : ''].filter(Boolean).join(' · ');
                    const cover = sanitizeImageSrc(card.cover);

                    return `
                        <a class="slider-card" href="${card.href}">
                            ${badgeHtml}
                            <img src="${cover}" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'200\' height=\'300\' viewBox=\'0 0 200 300\'><rect width=\'100%\' height=\'100%\' fill=\'%23020617\'/><text x=\'50%\' y=\'50%\' dominant-baseline=\'middle\' text-anchor=\'middle\' fill=\'%23475569\' font-family=\'sans-serif\' font-size=\'14\'>No Cover</text></svg>';" alt="${card.title}">
                            <div class="slider-card-overlay">
                                <div class="title">${card.title}</div>
                                <div class="meta-line">${metaBits}</div>
                            </div>
                        </a>
                    `;
                }).join('')
                : '<div class="collection-empty">No titles found for this collection.</div>';

            const viewAllHref = getCollectionViewAllHref(collection);
            const viewAllHtml = viewAllHref
                ? `<a class="view-all-link" href="${viewAllHref}">View all</a>`
                : '';

            return `
                <section class="collection-row">
                    <div class="scroller-title">
                        <div class="scroller-title-main">
                            <h2>${collection.title || 'Collection'}</h2>
                            ${collection.subtitle ? `<span>${collection.subtitle}</span>` : ''}
                        </div>
                        ${viewAllHtml}
                    </div>
                    <div class="slider-wrapper">
                        <button class="arrow__btn left-arrow" type="button" onclick="scrollSlider('${collection.id}', -1)">‹</button>
                        <div class="movie-slider" id="${collection.id}">${cards}</div>
                        <button class="arrow__btn right-arrow" type="button" onclick="scrollSlider('${collection.id}', 1)">›</button>
                    </div>
                </section>
            `;
        }

        function buildCollectionRows(mediaList) {
            const rows = [];

            const encodeQueryValue = (value) => encodeURIComponent(String(value || '').trim());
            const recentHref = `/gridview.html?title=${encodeQueryValue('Recently Added')}&sort=recent`;
            const topRatedHref = `/gridview.html?title=${encodeQueryValue('Top Rated')}&sort=score&minScore=8`;
            const tvHref = `/gridview.html?title=${encodeQueryValue('TV Shows')}&type=series&sort=title`;

            const recent = [...mediaList].sort((a, b) => {
                const aTime = new Date(a.updatedAt || 0).getTime();
                const bTime = new Date(b.updatedAt || 0).getTime();
                return bTime - aTime;
            });
            rows.push(renderSliderRow('Recently Added', 'newest items first', recent.slice(0, 18), 'recently-added-row', {
                viewAllHref: recentHref
            }));

            const topRated = [...mediaList]
                .filter(media => getScore(media) !== null && getScore(media) >= 8)
                .sort((a, b) => (getScore(b) || 0) - (getScore(a) || 0));
            rows.push(renderSliderRow('Top Rated', 'IMDb score 8.0 and up', topRated.slice(0, 18), 'top-rated-row', {
                viewAllHref: topRatedHref
            }));

            const shows = mediaList.filter(media => media.contentType === 'series');
            if (shows.length > 0) {
                rows.push(renderSliderRow('TV Shows', 'series collection', shows.slice(0, 18), 'series-row', {
                    viewAllHref: tvHref
                }));
            }

            const genreMap = new Map();
            mediaList.forEach(media => {
                normalizeGenres(media).slice(0, 2).forEach(genre => {
                    if (!genreMap.has(genre)) genreMap.set(genre, []);
                    genreMap.get(genre).push(media);
                });
            });

            [...genreMap.entries()]
                .sort((a, b) => b[1].length - a[1].length)
                .slice(0, 3)
                .forEach(([genre, items]) => {
                    const genreHref = `/gridview.html?title=${encodeQueryValue(genre)}&genre=${encodeQueryValue(genre)}&sort=title`;
                    rows.push(renderSliderRow(genre, 'genre collection', items.slice(0, 18), `genre-${genre.toLowerCase().replace(/[^a-z0-9]+/g, '-')}`, {
                        viewAllHref: genreHref
                    }));
                });

            return rows.join('');
        }

        function scrollSlider(rowId, direction) {
            const slider = document.getElementById(rowId);
            if (!slider) return;

            const scrollAmount = slider.clientWidth * 0.75;
            slider.scrollBy({
                left: direction * scrollAmount,
                behavior: 'smooth'
            });
        }

        function resolveAvatarPath(avatarFileName) {
            const raw = String(avatarFileName || '').trim();
            const match = /^avatar_(\d{3})\.png$/i.exec(raw);
            if (!match) return '/images/avatar.png';

            const numeric = Number(match[1]);
            if (!Number.isFinite(numeric) || numeric < 1 || numeric > 136) {
                return '/images/avatar.png';
            }

            return `/images/avatars/avatar_${String(numeric).padStart(3, '0')}.png`;
        }

        async function hydrateUserProfileHeader() {
            try {
                const res = await fetch('/api/auth/me');
                const data = await res.json();
                if (data.loggedIn) {
                    const cleanUsername = String(data.username || '').toLowerCase().trim();
                    const fallbackName = String(data.email || data.username || '').split('@')[0] || data.username || '';
                    const formattedName = fallbackName.charAt(0).toUpperCase() + fallbackName.slice(1);
                    const displayName = data.displayName || data.config?.displayName || data.config?.name || data.config?.username || formattedName;
                    const avatarPath = resolveAvatarPath(data.config?.avatar);
                    const menuUser = document.getElementById('avatar-menu-user');
                    if (menuUser) {
                        menuUser.textContent = displayName;
                    }

                    const avatarImage = document.getElementById('header-avatar-image');
                    if (avatarImage) {
                        avatarImage.src = avatarPath;
                    }
                    
                    // 🛡️ IDENTITY GATING: Expose admin configurations explicitly for 'josh'
                    if (cleanUsername === 'josh' || cleanUsername.startsWith('josh@') || data.config?.isAdmin === true) {
                        const adminBtn = document.getElementById('admin-action-btn');
                        if (adminBtn) {
                            adminBtn.style.display = 'inline-flex';
                        }
                    }
                }
            } catch (e) {
                console.error("Profile name tracking sync lost.");
            }
        }

        function initAvatarMenu() {
            const btn = document.getElementById('avatar-btn');
            const menu = document.getElementById('avatar-menu');
            if (!btn || !menu) return;

            btn.addEventListener('click', async (event) => {
                event.stopPropagation();
                menu.classList.toggle('show');
                if (menu.classList.contains('show')) {
                    await refreshNotificationsPanel();
                }
            });

            document.addEventListener('click', (event) => {
                if (!event.target.closest('.avatar-wrap')) {
                    menu.classList.remove('show');
                }
            });
        }

        function initInstallPrompt() {
            const installButton = document.getElementById('install-app-btn');
            if (!installButton) return;

            installButton.addEventListener('click', async () => {
                if (!deferredInstallPrompt) return;

                installButton.disabled = true;

                try {
                    await deferredInstallPrompt.prompt();
                    const choice = await deferredInstallPrompt.userChoice;
                    if (choice && choice.outcome === 'accepted') {
                        deferredInstallPrompt = null;
                    }
                } catch (_err) {
                    // Keep the current prompt state if the browser rejects the install request.
                }

                updateInstallButton();
            });

            window.addEventListener('beforeinstallprompt', (event) => {
                event.preventDefault();
                deferredInstallPrompt = event;
                updateInstallButton();
            });

            window.addEventListener('appinstalled', () => {
                deferredInstallPrompt = null;
                updateInstallButton();
            });

            updateInstallButton();
        }

        async function loadMovies(page = 1) {
            currentCatalogPage = page;
            try {
                const grid = document.getElementById('movie-grid');
                const res = await fetch('/api/home-feed');
                const data = await res.json();
                const collections = data?.feed?.collections || [];
                const flattenedCards = collections.flatMap((collection) => Array.isArray(collection.cards) ? collection.cards : []);
                const dedupedCards = new Map();
                for (const card of flattenedCards) {
                    if (!card || typeof card !== 'object') continue;
                    const dedupeKey = String(
                        card.id ||
                        card.href ||
                        `${card.title || ''}|${card.year || ''}|${card.imdbId || ''}`
                    ).trim();
                    if (!dedupeKey) continue;
                    if (!dedupedCards.has(dedupeKey)) {
                        dedupedCards.set(dedupeKey, card);
                    }
                }
                homeSearchCards = Array.from(dedupedCards.values());

                if (collections.length > 0) {
                    grid.innerHTML = collections.map(renderFeedRow).join('');
                    document.getElementById('pagination-container').innerHTML = '';
                } else {
                    grid.innerHTML = `<div class="collection-empty" style="text-align: center; padding: 40px;">Your media library is currently empty. Click above to add content!</div>`;
                    document.getElementById('pagination-container').innerHTML = '';
                }
            } catch (err) {
                console.error("❌ Frontend failed to load pre-generated home feed:", err);
            }
        }

        function renderHomeSearchCards(items, isLocal) {
            return items.map((item) => {
                const title = sanitizeSearchText(item.title || 'Unknown Title') || 'Unknown Title';
                const year = sanitizeSearchText(item.year || '');
                const genre = sanitizeSearchText(item.genre || '');
                const href = item.href || '/browse.html';
                const cover = sanitizeImageSrc(item.cover);
                const actionText = isLocal ? 'Play in Library' : 'Open Browse';
                const safeTitle = escapeHtml(title);
                const safeSub = escapeHtml([year, genre].filter(Boolean).join(' · ') || 'Movie');

                return `
                    <article class="home-search-card ${isLocal ? 'local' : ''}">
                        <img class="home-search-cover" src="${cover}" alt="${safeTitle}" onerror="this.onerror=null; this.src='${NO_COVER_DATA_URI}'">
                        <div class="home-search-info">
                            <div class="home-search-title">${safeTitle}</div>
                            <div class="home-search-sub">${safeSub}</div>
                            <a class="home-search-link" href="${href}">${actionText}</a>
                        </div>
                    </article>
                `;
            }).join('');
        }

        function escapeHtml(value) {
            return String(value || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatRelativeNotificationTime(isoString) {
            const timeMs = Date.parse(String(isoString || ''));
            if (!Number.isFinite(timeMs)) return 'just now';
            const deltaSec = Math.max(0, Math.floor((Date.now() - timeMs) / 1000));
            if (deltaSec < 60) return 'just now';
            const mins = Math.floor(deltaSec / 60);
            if (mins < 60) return `${mins}m ago`;
            const hours = Math.floor(mins / 60);
            if (hours < 24) return `${hours}h ago`;
            const days = Math.floor(hours / 24);
            return `${days}d ago`;
        }

        function updateBellFromSummary(summary) {
            const bell = document.getElementById('avatar-bell');
            if (!bell) return;
            const total = Number(summary?.total || 0);
            bell.setAttribute('data-has-unread', total > 0 ? 'true' : 'false');
            bell.textContent = total > 0 ? '🔔' : '🔕';
        }

        function renderNotificationGroups(payload) {
            const countsEl = document.getElementById('notify-counts');
            const listEl = document.getElementById('notify-list');
            if (!countsEl || !listEl) return;

            const summary = payload?.summary || { system: 0, library: 0, user: 0, total: 0 };
            updateBellFromSummary(summary);

            countsEl.innerHTML = `
                <span class="notify-chip">System ${summary.system || 0}</span>
                <span class="notify-chip">My Library ${summary.library || 0}</span>
                <span class="notify-chip">User ${summary.user || 0}</span>
            `;

            const groups = payload?.groups || {};
            const categories = [
                { key: 'system', title: 'System' },
                { key: 'library', title: 'My Library' },
                { key: 'user', title: 'User' }
            ];

            const blocks = categories.map((group) => {
                const rows = Array.isArray(groups[group.key]) ? groups[group.key].slice(0, 3) : [];
                if (!rows.length) return '';
                const items = rows.map((item) => {
                    const safeTitle = escapeHtml(item.title || 'Notification');
                    const safeBody = escapeHtml(item.message || '');
                    const timeLabel = formatRelativeNotificationTime(item.createdAt);
                    const href = String(item.href || '').trim();
                    const titleHtml = href
                        ? `<a class="notify-link" href="${href}">${safeTitle}</a>`
                        : safeTitle;

                    return `
                        <article class="notify-item">
                            <div class="notify-item-title">${titleHtml}</div>
                            <div class="notify-item-body">${safeBody || '&nbsp;'}</div>
                            <div class="notify-item-meta">${timeLabel}</div>
                        </article>
                    `;
                }).join('');

                return `
                    <section>
                        <div class="notify-item-meta" style="margin-bottom:4px; font-weight:700; text-transform:uppercase; letter-spacing:0.03em;">${group.title}</div>
                        <div class="notify-list">${items}</div>
                    </section>
                `;
            }).filter(Boolean);

            if (!blocks.length) {
                listEl.innerHTML = '<div class="notify-empty">No notifications right now.</div>';
                return;
            }

            listEl.innerHTML = blocks.join('');
        }

        async function refreshNotificationsPanel() {
            try {
                const response = await fetch('/api/profile/notifications?limit=30&limitPerCategory=3', {
                    credentials: 'include'
                });
                const data = await response.json();
                if (!data?.success) {
                    renderNotificationGroups({ summary: { system: 0, library: 0, user: 0, total: 0 }, groups: {} });
                    return;
                }

                headerNotifications = data;
                renderNotificationGroups(data);
            } catch (_err) {
                renderNotificationGroups({ summary: { system: 0, library: 0, user: 0, total: 0 }, groups: {} });
            }
        }

        function sanitizeSearchText(value) {
            return String(value || '')
                .replace(/<[^>]*>/g, ' ')
                .replace(/no\s*cover\s*(?:&quot;|"|'|>|&gt;|&#39;)+/gi, '')
                .replace(/no\s*cover\s*(?:&quot;|["'>])+?/gi, '')
                .replace(/no\s*cover/gi, '')
                .replace(/\s+/g, ' ')
                .trim();
        }

        function sanitizeImageSrc(value) {
            const raw = String(value || '').trim();
            if (!raw) return '';

            if (raw.startsWith('http://') || raw.startsWith('https://') || raw.startsWith('/') || raw.startsWith('data:image/')) {
                if (raw.startsWith('/movie-assets/') || raw.startsWith('/images/')) {
                    return encodeURI(decodeURI(raw).replace(/"/g, '%22'));
                }

                return encodeURI(raw.replace(/"/g, '%22'));
            }

            return '';
        }

        function findLocalHomeMatches(query) {
            const normalizedQuery = normalizeSearchText(query);
            if (!normalizedQuery) return [];

            const scored = homeSearchCards
                .map((card) => {
                    const title = String(card.title || '');
                    const genre = String(card.genre || '');
                    const imdb = String(card.imdbId || '');
                    const titleNorm = normalizeSearchText(title);
                    const genreNorm = normalizeSearchText(genre);
                    const imdbNorm = normalizeSearchText(imdb);

                    let score = 0;
                    if (titleNorm === normalizedQuery) score += 260;
                    if (titleNorm.startsWith(normalizedQuery)) score += 180;
                    if (titleNorm.includes(normalizedQuery)) score += 140;
                    if (genreNorm.includes(normalizedQuery)) score += 35;
                    if (imdbNorm && imdbNorm.includes(normalizedQuery)) score += 75;

                    return { card, score };
                })
                .filter((entry) => entry.score > 0)
                .sort((a, b) => b.score - a.score)
                .slice(0, 12)
                .map((entry) => entry.card);

            return scored;
        }

        function resetHomeSearchPanel() {
            const panel = document.getElementById('home-search-panel');
            const meta = document.getElementById('home-search-meta');
            const grid = document.getElementById('home-search-grid');
            if (!panel || !meta || !grid) return;

            panel.classList.remove('show');
            meta.textContent = '';
            grid.innerHTML = '';
        }

        async function runHomeSearch() {
            const input = document.getElementById('home-search-input');
            const panel = document.getElementById('home-search-panel');
            const meta = document.getElementById('home-search-meta');
            const grid = document.getElementById('home-search-grid');
            if (!input || !panel || !meta || !grid) return;

            const query = String(input.value || '').trim();
            if (!query) {
                resetHomeSearchPanel();
                return;
            }

            const localMatches = findLocalHomeMatches(query);
            if (localMatches.length > 0) {
                meta.textContent = `Found ${localMatches.length} local match(es) in your library.`;
                grid.innerHTML = renderHomeSearchCards(localMatches, true);
                panel.classList.add('show');
                return;
            }

            meta.textContent = 'No local matches found. Searching browse catalog...';
            grid.innerHTML = '';
            panel.classList.add('show');

            try {
                const res = await fetch(`/api/movies/search/unified?q=${encodeURIComponent(query)}&remoteMode=on_local_empty&remoteLimit=12&localLimit=8`);
                const data = await res.json();
                if (!data.success) {
                    meta.textContent = 'Search is temporarily unavailable.';
                    return;
                }

                const remote = Array.isArray(data.remoteResults) ? data.remoteResults : [];
                if (!remote.length) {
                    meta.textContent = `No local or remote results for "${query}".`;
                    return;
                }

                meta.textContent = `No local hits. Showing ${remote.length} remote result(s).`;
                const remoteCards = remote.map((item) => ({
                    title: item.title,
                    year: item.year,
                    genre: item.imdbId || '',
                    cover: item.cover,
                    href: `/browse.html?q=${encodeURIComponent(query)}`
                }));
                grid.innerHTML = renderHomeSearchCards(remoteCards, false);
            } catch (_err) {
                meta.textContent = 'Search failed. Try again in a moment.';
            }
        }

        function initHomeSearch() {
            const input = document.getElementById('home-search-input');
            const button = document.getElementById('home-search-btn');
            if (!input || !button) return;

            button.addEventListener('click', runHomeSearch);
            input.addEventListener('keydown', (event) => {
                if (event.key === 'Enter') {
                    event.preventDefault();
                    runHomeSearch();
                }
            });
            input.addEventListener('input', () => {
                if (!String(input.value || '').trim()) {
                    resetHomeSearchPanel();
                }
            });
        }

        async function updatePipelineStatus() {
            const monitorBox = document.getElementById('pipeline-monitor');
            const rowsContainer = document.getElementById('pipeline-rows');
            const scopeLabel = document.getElementById('pipeline-scope-label');

            try {
                // Pass credentials so the requireAuth middleware can see session cookie
                const res = await fetch('/api/pipeline/status', {
                    credentials: 'include'
                });

                // If the server tells us we are unauthorized, hide the box and stop processing
                if (res.status === 401 || res.status === 403) {
                    monitorBox.style.display = 'none';
                    return;
                }

                const data = await res.json();
                let html = '';
                if (scopeLabel) {
                    scopeLabel.textContent = data.scope === 'all'
                        ? 'Showing all active pipeline jobs'
                        : 'Showing your active pipeline jobs';
                }

                // Stage-based color mapping for consistent visual hierarchy
                const stageColors = {
                    downloading: '#f59e0b',
                    ingest: '#8b5cf6',
                    metadata: '#6366f1',
                    subtitles: '#06b6d4',
                    transcode: '#a855f7',
                    complete: '#10b981',
                    processing: '#64748b'
                };

                // Render active pipeline items
                if (data.success && data.pipeline && data.pipeline.length > 0) {
                    html += data.pipeline.map(item => {
                        const statusColor = stageColors[item.stage] || '#f59e0b';
                        const progress = typeof item.progress === 'number' ? item.progress : 50;
                        const displayProgress = typeof item.progress === 'number'
                            ? item.progress.toFixed(0) + '%'
                            : item.progress;

                        return `
                            <div style="background: #1a1f2e; padding: 14px 16px; border-radius: 8px; display: flex; flex-direction: column; gap: 8px; border-left: 4px solid ${statusColor}; margin-bottom: 8px;">
                                <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                                    <div style="flex-grow: 1; min-width: 300px;">
                                        <div style="font-size: 0.95rem; color: #f8fafc; font-weight: 600;">${item.title}</div>
                                        <div style="font-size: 0.75rem; color: #94a3b8; margin-top: 2px;">Size: ${item.size}${data.scope === 'all' && item.addedByUser ? ` • User: ${item.addedByUser}` : ''}</div>
                                    </div>
                                    <div style="text-align: right;">
                                        <span style="background: ${statusColor}40; color: ${statusColor}; padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; white-space: nowrap;">
                                            ${item.status}
                                        </span>
                                    </div>
                                </div>
                                <div style="width: 100%; height: 6px; background: #0f172a; border-radius: 3px; overflow: hidden;">
                                    <div style="height: 100%; width: ${progress}%; background: ${statusColor}; transition: width 0.3s ease; border-radius: 3px;"></div>
                                </div>
                                <div style="display: flex; justify-content: space-between; align-items: center;">
                                    <span style="font-size: 0.75rem; color: #64748b;">Progress</span>
                                    <span style="font-size: 0.85rem; color: ${statusColor}; font-weight: 600;">${displayProgress}</span>
                                </div>
                            </div>
                        `;
                    }).join('');
                }

                // Render failed jobs (read-only on index)
                if (data.failures && data.failures.length > 0) {
                    html += '<div style="margin-top: 16px; padding-top: 16px; border-top: 1px solid #334155;">';
                    html += '<div style="font-size: 0.85rem; color: #ef4444; font-weight: 600; margin-bottom: 10px;">⚠️ Failed Jobs</div>';
                    html += data.failures.map(failure => {
                        return `
                            <div style="background: #1a1f2e; padding: 12px 14px; border-radius: 8px; display: flex; flex-direction: column; gap: 6px; border-left: 4px solid #ef4444; margin-bottom: 8px;">
                                <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                                    <div style="flex-grow: 1; min-width: 250px;">
                                        <div style="font-size: 0.95rem; color: #f8fafc; font-weight: 600;">${failure.title}</div>
                                        <div style="font-size: 0.75rem; color: #fca5a5; margin-top: 2px;">Error: ${failure.error}</div>
                                    </div>
                                    <span style="background: #ef444440; color: #ef4444; padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; white-space: nowrap;">
                                        ${failure.status}
                                    </span>
                                </div>
                            </div>
                        `;
                    }).join('');
                    html += '</div>';
                }

                if (html) {
                    monitorBox.style.display = 'block';
                    rowsContainer.innerHTML = html;
                } else {
                    monitorBox.style.display = 'none';
                }
            } catch (err) {
                console.error('Failed querying system sync states.', err);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            initAvatarMenu();
            initInstallPrompt();
            initHomeSearch();
            hydrateUserProfileHeader();
            loadMovies(1);
            refreshNotificationsPanel();
            setInterval(updatePipelineStatus, 5000);
            updatePipelineStatus();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch((err) => {
                    console.warn('Service worker registration skipped:', err && err.message ? err.message : err);
                });
            });
        }
    </script>
    <script src="/js/api-failover.js"></script>
</body>
