x-app-common: &app-common
  image: simple-streamer:v2
  build:
    context: .
    dockerfile: Dockerfile
    network: host
  restart: unless-stopped
  env_file:
    - .env
  environment:
    WORKER_URL_INGEST: "http://ingest-worker:5000/process"
    WORKER_URL_METADATA: "http://metadata-worker:5001/process"
    WORKER_URL_SUBTITLES: "http://subtitle-worker:5002/process"
    WORKER_URL_TRANSCODE: "http://transcoder-worker:5003/process"
    WORKER_URL_CLOUDSYNC: "http://cloudsync-worker:5004/process"
  volumes:
    - /home/epic/movies:/app/storage/movies
    - /data/blockchain/media/Series:/app/storage/series
    - /home/epic/movie-streamer-data:/app/metadata
    - /home/epic/movie-streamer/metadata:/app/catalog-metadata:ro
    - /home/epic/tobedel:/app/archive
    - /home/epic/.config/subliminal:/root/.config/subliminal:ro
  networks:
    - needmonero_needmonero
  depends_on:
    redis:
      condition: service_healthy

services:
  movie-streamer:
    <<: *app-common
    container_name: movie-streamer-v2-test
    cpus: "4.0"
    environment:
      WORKER_URL_INGEST: "http://ingest-worker:5000/process"
      WORKER_URL_METADATA: "http://metadata-worker:5001/process"
      WORKER_URL_SUBTITLES: "http://subtitle-worker:5002/process"
      WORKER_URL_TRANSCODE: "http://transcoder-worker:5003/process"
      WORKER_URL_CLOUDSYNC: "http://cloudsync-worker:5004/process"
      ARCHIVE_REMOTE_POLICY: "source_synced"
      ARCHIVE_SOURCE_PROFILE: "1080p"
      ENABLE_WEB_SERVER: "true"
      ENABLE_PIPELINE_WATCHER: "false"
      ENABLE_INGEST_WORKER: "false"
      ENABLE_METADATA_WORKER: "false"
      ENABLE_SUBTITLE_WORKER: "false"
      ENABLE_TRANSCODER_WORKER: "false"
      ENABLE_CLOUDSYNC_WORKER: "false"
    expose:
      - "3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  pipeline-runner:
    <<: *app-common
    container_name: movie-streamer-pipeline-runner
    cpus: "1.0"
    command: ["node", "src/services/workers/PipelineRunner.js"]
    environment:
      WORKER_URL_INGEST: "http://ingest-worker:5000/process"
      WORKER_URL_METADATA: "http://metadata-worker:5001/process"
      WORKER_URL_SUBTITLES: "http://subtitle-worker:5002/process"
      WORKER_URL_TRANSCODE: "http://transcoder-worker:5003/process"
      WORKER_URL_CLOUDSYNC: "http://cloudsync-worker:5004/process"
      ENABLE_PIPELINE_WATCHER: "false"
    depends_on:
      redis:
        condition: service_healthy

  ingest-worker:
    <<: *app-common
    container_name: movie-streamer-ingest-worker
    cpus: "1.0"
    command: ["node", "src/services/workers/IngestSanitizerWorker.js"]
    ports:
      - "5000:5000"

  metadata-worker:
    <<: *app-common
    container_name: movie-streamer-metadata-worker
    cpus: "1.0"
    command: ["node", "src/services/workers/MetadataWorker.js"]
    ports:
      - "5001:5001"

  subtitle-worker:
    <<: *app-common
    container_name: movie-streamer-subtitle-worker
    cpus: "1.0"
    command: ["node", "src/services/workers/SubtitleWorker.js"]
    ports:
      - "5002:5002"

  transcoder-worker:
    <<: *app-common
    container_name: movie-streamer-transcoder-worker
    cpus: "2.0"
    command: ["node", "src/services/workers/TranscoderWorker.js"]
    ports:
      - "5003:5003"

  cloudsync-worker:
    <<: *app-common
    container_name: movie-streamer-cloudsync-worker
    cpus: "1.0"
    command: ["node", "src/services/workers/CloudSyncWorker.js"]
    ports:
      - "${APP_CLOUDSYNC_HOST_PORT:-5004}:5004"

  # --- 🧠 HIGH-PERFORMANCE MEMORY DATA ENGINE ---
  redis:
    image: redis:7-alpine
    container_name: anymovie-redis-cache
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - /home/epic/redis/data:/data
    networks:
      - needmonero_needmonero
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  needmonero_needmonero:
    external: true # Tells Compose this custom backend network layer is already up and running on the host